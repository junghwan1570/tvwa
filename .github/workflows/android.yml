name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRIV_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 비밀값이 없을 때 쓰는 임시 키: 한 번 만들어 GitHub 캐시에 보관하고 계속 재사용
      # → 같은 키로 서명돼 업데이트 설치가 됨 (7일 넘게 빌드가 없으면 GitHub가 지울 수 있음)
      - uses: actions/cache@v4
        with:
          path: android/ci-temp.keystore
          key: android-ci-temp-keystore-v1

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/release.keystore; echo "고정 키(비밀값)로 서명합니다"
          else
            if [ ! -f android/ci-temp.keystore ]; then
              keytool -genkeypair -keystore android/ci-temp.keystore -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android -dname "CN=Myeongwang TV temp, C=KR"
              echo "::warning::임시 키를 새로 만들었습니다 (이번 한 번은 기존 앱을 지우고 설치해야 함)"
            else
              echo "보관해 둔 임시 키로 서명합니다"
            fi
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/full/release/app-full-release.apk MyeongwangTV.apk
          cp android/app/build/outputs/apk/pub/release/app-pub-release.apk MyeongwangTV-Public.apk

      # 공개 저장소라 누구나 받을 수 있으므로 공개판만 올림 (내 전용 APK는 집 NAS 주소가 들어 있어 올리지 않음)
      - uses: actions/upload-artifact@v4
        with:
          name: MyeongwangTV-Public
          path: MyeongwangTV-Public.apk
          retention-days: 7

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 명왕사신TV 앱 (최신)
          body: |
            MyeongwangTV-Public.apk: 공개판 (공개 주소만 사용, 유튜브는 설정에서 본인 API 키 입력)
            빌드 ${{ github.run_number }} · ${{ github.sha }}
          files: MyeongwangTV-Public.apk
          make_latest: true

      # 내 전용 APK를 공개키로 암호화해서 빌드 결과물로 보관 (개인키가 있는 사람만 풀 수 있음, 3일 뒤 삭제)
      - name: Encrypt my APK
        run: |
          cat > pub.pem <<'KEY'
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvOtwNrD+eihpTpcDLTtf
            sxb0xIL2RkiEakd6h5Eqlbrq8HzDYdwGeybz0IrJGGrc3XBFPs1jOiAPsJGqwZ/n
            DQx4UAuEYD6oFtIjT0eg27RE4XE8lV1YLaHnxdUiOYnYvupmS+LdIS2/IO0LN8dy
            ykZHvKOn4kc+l3cmcFfONCptL6dcEy8M7xKVehC+slyPaOfs0XnwLlNc7U/cU0Wb
            WzkRNaBZ0qql45wYNp4GRTXMmPxW4TqeFqGt33puA7OehWntIqcaNxjqLlvIHBD7
            qCRuf6IPSYXYWTZ2mcPsy7BxTBIUFAqiOMZ34tO+XliA/AptnU0uVLUbb5VKCz8u
            HP6kgwY8r+MAXWRRhNaLpvlAXa1FiAr+6f9/AZxICNWDQrx9W0K6PKMTFQ0YEjnX
            bKEGAj4U2/QIcT5lQeJWtKBmVVVbnHNgCQ+EL3sSHL5qkp4xwki9my8/PHSH3rE7
            w4hLBfs34CwSptS017hGs+R6SDReQa7qzGE0/J73gFvTAgMBAAE=
            -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' pub.pem
          openssl rand -hex 32 > k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.txt -out MyeongwangTV.key.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -in MyeongwangTV.apk -out MyeongwangTV.apk.enc -pass file:k.txt
          rm k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MyeongwangTV-mine-encrypted
          path: |
            MyeongwangTV.apk.enc
            MyeongwangTV.key.enc
          retention-days: 3

      # 내 전용 APK → 비공개 저장소(tvwaad)의 릴리스로. 비밀값 PRIVATE_RELEASE_TOKEN이 있을 때만.
      - name: Publish my APK to the private repo
        if: ${{ env.PRIV_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: junghwan1570/tvwaad
          token: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          tag_name: android-latest
          name: 명왕사신TV 앱 (내 전용, 최신)
          body: |
            MyeongwangTV.apk: 내 전용 (집 NAS 사용)
            빌드 ${{ github.run_number }} · ${{ github.sha }}
          files: MyeongwangTV.apk
          make_latest: true
