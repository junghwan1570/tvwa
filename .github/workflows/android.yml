name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 비밀값이 없을 때 쓰는 임시 키: 한 번 만들어 GitHub 캐시에 보관하고 계속 재사용
      # → 같은 키로 서명돼 업데이트 설치가 됨 (7일 넘게 빌드가 없으면 GitHub가 지울 수 있음)
      - uses: actions/cache@v4
        with:
          path: android/ci-temp.keystore
          key: android-ci-temp-keystore-v1

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/release.keystore; echo "고정 키(비밀값)로 서명합니다"
          else
            if [ ! -f android/ci-temp.keystore ]; then
              keytool -genkeypair -keystore android/ci-temp.keystore -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android -dname "CN=Myeongwang TV temp, C=KR"
              echo "::warning::임시 키를 새로 만들었습니다 (이번 한 번은 기존 앱을 지우고 설치해야 함)"
            else
              echo "보관해 둔 임시 키로 서명합니다"
            fi
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MyeongwangTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyeongwangTV
          path: MyeongwangTV.apk

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 명왕사신TV 앱 (최신)
          body: |
            휴대폰에서 아래 MyeongwangTV.apk를 받아 설치하세요.
            빌드 ${{ github.run_number }} · ${{ github.sha }}
          files: MyeongwangTV.apk
          make_latest: true
