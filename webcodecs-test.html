<style>
/* 차량 화면용 단일 다크 테마: 위에 큰 판정, 아래 세부 항목 */
:root{color-scheme:dark;--bg:#0b1018;--card:#151d29;--bdr:#243042;--tx:#eef2f8;--tx2:#9aa6b8;--ok:#b8f03c;--bad:#ff6b5e;--warn:#f0b429;--font:'Noto Sans KR',system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 var(--font);padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:980px;margin:0 auto;display:grid;gap:16px}
h1{margin:0;font-size:26px}
p{margin:0;color:var(--tx2)}
button{font:inherit;min-height:60px;padding:0 28px;border:0;border-radius:16px;background:var(--ok);color:#10180a;font-weight:800;font-size:19px;cursor:pointer}
button:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bdr)}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.verdict{border-radius:18px;padding:18px 20px;background:var(--card);border:1px solid var(--bdr);font-size:20px;font-weight:700}
.verdict.ok{border-color:var(--ok);color:var(--ok)}
.verdict.bad{border-color:var(--bad);color:var(--bad)}
.verdict.warn{border-color:var(--warn);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 4px;border-top:1px solid var(--bdr);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;font-weight:700}
.y{color:var(--ok)}.n{color:var(--bad)}.m{color:var(--warn)}
canvas{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
pre{margin:0;white-space:pre-wrap;word-break:break-all;font:13px/1.5 var(--mono);color:var(--tx2);max-height:220px;overflow:auto}
</style>

<main>
  <h1>WebCodecs 점검</h1>
  <p>테슬라 브라우저가 H.264 영상을 다시 인코딩하지 않고 직접 풀어서 화면에 그릴 수 있는지 확인합니다. 정차 중 한 번, 주행 중(동승자) 한 번 눌러 보세요.</p>

    if(sc3||sc4){ if(start>=0) out.push(buf.subarray(start,i)); i+=sc3?3:4; start=i; } else i++;
  }
  if(start>=0) out.push(buf.subarray(start));
  return out;
}
function accessUnits(buf){
  const aus=[];let pend=[];
  for(const n of nalus(buf)){
    const t=n[0]&31; pend.push(n);
    if(t===1||t===5){
      const len=pend.reduce((s,x)=>s+4+x.length,0), d=new Uint8Array(len);let o=0;
      for(const x of pend){d.set([0,0,0,1],o);d.set(x,o+4);o+=4+x.length;}
      aus.push({key:pend.some(x=>(x[0]&31)===5),data:d,sps:pend.find(x=>(x[0]&31)===7)});pend=[];
    }
  }
  return aus;
}
const hex=b=>b.toString(16).padStart(2,'0').toUpperCase();

async function decodeTest(){
  if(!('VideoDecoder' in window)) return {ok:false,msg:'VideoDecoder 없음'};
  const aus=accessUnits(b64(V)); const sps=aus[0].sps;
  const codec='avc1.'+hex(sps[1])+hex(sps[2])+hex(sps[3]);
  const cv=$('cv'),ctx=cv.getContext('2d');
  let frames=0,err=null,first=0;
  const t0=performance.now();
  const dec=new VideoDecoder({output:f=>{frames++; if(!first) first=performance.now()-t0; ctx.drawImage(f,0,0,cv.width,cv.height); f.close();}, error:e=>{err=e;}});
  const cfg={codec,codedWidth:1920,codedHeight:1080,optimizeForLatency:true};
  try{ const s=await VideoDecoder.isConfigSupported(cfg); if(!s.supported) return {ok:false,msg:codec+' 미지원'}; }catch(e){ return {ok:false,msg:'설정 확인 실패: '+e.message}; }
  try{
    dec.configure(cfg);
    aus.forEach((u,i)=>dec.decode(new EncodedVideoChunk({type:u.key?'key':'delta',timestamp:i*33333,data:u.data})));
    await dec.flush();
  }catch(e){ err=err||e; }
  const ms=performance.now()-t0; try{dec.close();}catch{}
  if(err||!frames) return {ok:false,msg:'풀기 실패: '+(err?err.message:'프레임 0개'),codec};
  return {ok:true,codec,frames,total:aus.length,ms:Math.round(ms),fps:Math.round(frames/(ms/1000)),first:Math.round(first)};
}
async function audioTest(){
  if(!('AudioDecoder' in window)) return {ok:false,msg:'AudioDecoder 없음'};
  const buf=b64(A),chunks=[];let i=0;
  while(i+7<buf.length && buf[i]===0xFF && (buf[i+1]&0xF0)===0xF0){ const len=((buf[i+3]&3)<<11)|(buf[i+4]<<3)|(buf[i+5]>>5); chunks.push(buf.subarray(i,i+len)); i+=len; }
  let n=0,err=null;
  const dec=new AudioDecoder({output:d=>{n++;d.close();},error:e=>{err=e;}});
  try{
    const cfg={codec:'mp4a.40.2',sampleRate:44100,numberOfChannels:1};
    const s=await AudioDecoder.isConfigSupported(cfg); if(!s.supported) return {ok:false,msg:'AAC 미지원'};
    dec.configure(cfg); chunks.forEach((c,k)=>dec.decode(new EncodedAudioChunk({type:'key',timestamp:k*23220,data:c}))); await dec.flush();
  }catch(e){err=err||e;}
  try{dec.close();}catch{}
  return err||!n?{ok:false,msg:'풀기 실패: '+(err?err.message:'0개')}:{ok:true,n,total:chunks.length};
}

async function run(){
  $('run').disabled=true; $('verdict').className='verdict'; $('verdict').textContent='점검 중…';
  ['feat','codec'].forEach(t=>$(t).innerHTML='');
  const f={VideoDecoder:'VideoDecoder' in window,AudioDecoder:'AudioDecoder' in window,VideoFrame:'VideoFrame' in window,'OffscreenCanvas':'OffscreenCanvas' in window,'Web Worker':'Worker' in window,WebSocket:'WebSocket' in window,MediaSource:'MediaSource' in window,'AudioContext':!!(window.AudioContext||window.webkitAudioContext),'hls 기본재생':!!document.createElement('video').canPlayType('application/vnd.apple.mpegurl')};
  R.feat=f; for(const[k,v]of Object.entries(f)){const[a,c]=yn(v);row('feat',k,a,c);}
  R.codec={};
  const list=[['H.264 Baseline 720p','avc1.42E01F',1280,720],['H.264 Main 1080p','avc1.4D4028',1920,1080],['H.264 High 1080p','avc1.640028',1920,1080],['H.265 Main 1080p','hvc1.1.6.L120.90',1920,1080],['VP9 1080p','vp09.00.40.08',1920,1080],['AV1 1080p','av01.0.08M.08',1920,1080]];
  for(const[name,codec,w,h]of list){
    if(!('VideoDecoder' in window)){row('codec',name,'없음','n');continue;}
    let sw=false,hw=false;
    try{sw=(await VideoDecoder.isConfigSupported({codec,codedWidth:w,codedHeight:h})).supported;}catch{}
    try{hw=(await VideoDecoder.isConfigSupported({codec,codedWidth:w,codedHeight:h,hardwareAcceleration:'prefer-hardware'})).supported;}catch{}
    R.codec[name]={sw,hw}; row('codec',name,sw?(hw?'지원 (하드웨어)':'지원'):'없음',sw?'y':'n');
  }
  if('AudioDecoder' in window){let s=false;try{s=(await AudioDecoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:2})).supported;}catch{} R.codec['AAC 음성']={sw:s}; row('codec','AAC 음성 (mp4a.40.2)',s?'지원':'없음',s?'y':'n');}
  $('dec').textContent='1080p 영상 15프레임을 풀어서 위에 그리는 중…';
  const d=await decodeTest(); R.decode=d;
  $('dec').innerHTML=d.ok?`<span class="y">성공</span> · ${d.codec} · ${d.frames}/${d.total}프레임 · ${d.ms}ms (약 ${d.fps}fps 속도) · 첫 프레임 ${d.first}ms`:`<span class="n">실패</span> · ${d.msg}`;
  const a=await audioTest(); R.audio=a;
  row('feat','AAC 실제 풀기',a.ok?`성공 ${a.n}/${a.total}`:'실패',a.ok?'y':'n');
  const v=$('verdict');
  if(d.ok&&a.ok&&d.fps>=30){v.className='verdict ok';v.textContent=`가능합니다. H.264 1080p를 다시 인코딩 없이 캔버스에 직접 재생할 수 있습니다 (${d.fps}fps 속도).`;}
  else if(d.ok){v.className='verdict warn';v.textContent=`부분 가능: 영상 풀기는 됩니다(${d.fps}fps 속도)`+(a.ok?'':', 음성(AAC)은 따로 풀어야 합니다')+(d.fps<30?', 속도가 30fps보다 느립니다':'')+'.';}
  else{v.className='verdict bad';v.textContent='불가: 이 브라우저는 WebCodecs로 H.264를 풀 수 없습니다. MPEG-1 방식을 유지해야 합니다.';}
  R.ua=navigator.userAgent; R.time=new Date().toLocaleString('ko-KR');
  $('run').disabled=false;
}
$('ua').textContent=navigator.userAgent+'\n화면 '+screen.width+'×'+screen.height+' · 배율 '+devicePixelRatio;
$('run').onclick=()=>run().catch(e=>{$('verdict').className='verdict bad';$('verdict').textContent='점검 중 오류: '+e.message;$('run').disabled=false;});
$('copy').onclick=()=>{const t=JSON.stringify(R,null,1);navigator.clipboard.writeText(t).then(()=>$('copy').textContent='복사했습니다').catch(()=>{$('ua').textContent=t;$('copy').textContent='아래 칸에 표시했습니다';});};
</script>
