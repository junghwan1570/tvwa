<style>
:root{color-scheme:dark;--bg:#0a0a10;--sf:#12121a;--card:#1a1a24;--card-h:#222230;--bdr:#2a2a38;--tx:#e8e8f0;--tx2:#8888a0;--tx3:#5a5a70;--red:#e53e3e;--grn:#38d67a;--amb:#f0b429;--blu:#4da6ff;--yt:#ff4444;--glow:0 0 20px rgba(229,62,62,.15)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:16px/1.5 'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 85%,transparent);padding-top:14px;padding-bottom:6px}
.top{display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:26px;letter-spacing:-.5px;white-space:nowrap;text-shadow:0 0 24px rgba(229,62,62,.3)}.brand b{color:var(--red)}
.clock{font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
#q{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bdr);color:var(--tx);border-radius:14px;padding:12px 18px;font:inherit;font-size:16px;outline:none;min-height:52px}
#q:focus{border-color:var(--red);box-shadow:var(--glow)}
.ib{background:var(--sf);border:1px solid var(--bdr);border-radius:14px;min-width:52px;min-height:52px;padding:0 16px;white-space:nowrap;font-size:18px}
.ib:active{background:var(--card-h)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px;border-bottom:1px solid var(--bdr)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 18px 10px;color:var(--tx2);font-weight:500;font-size:16px;white-space:nowrap;min-height:52px;transition:color .15s}
.tab.on{color:var(--tx);border-bottom-color:var(--red);font-weight:700}
.tab:active{color:var(--tx)}
.banner{margin-top:10px;background:#ff5a5a1a;border:1px solid #ff5a5a55;color:#ffb3b3;border-radius:14px;padding:12px 16px;font-size:14px}

.layout{display:grid;gap:20px;padding:16px 0 28px}
@media(min-width:900px){.layout.has-player{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.layout.has-player .pcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);align-self:start}}
.player{background:var(--sf);border:1px solid var(--bdr);border-radius:18px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.p-frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.p-frame video,.p-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:radial-gradient(ellipse,#14141c,#000 72%);z-index:2}
.ph .spin{width:40px;height:40px;border:3px solid #2a2a3a;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.ph .go.sec{background:var(--card);border:1px solid var(--bdr);color:var(--tx)}

.p-title{flex:1;min-width:0}

.pb{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:0 16px;min-height:48px;font-size:14px;color:var(--tx2);white-space:nowrap;transition:background .1s}

.ch-n{font-size:15px;font-weight:700;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

const EBS=p=>`https://ebsonair.ebs.co.kr/${p}familypc/familypc1m/playlist.m3u8`;
const KAPI=c=>'https://pwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/'+c;

// 방송사 API가 CORS로 막히면 Cloudflare Worker 주소를 여기에 넣으세요 (예: 'https://tvtoken.내계정.workers.dev')
const TOKEN_PROXY = '';

async function getText(url){
  const u = TOKEN_PROXY ? TOKEN_PROXY + '?url=' + encodeURIComponent(url) : url;
  let res;
  try { res = await fetch(u, { cache:'no-store' }); }
  catch(e){ throw new Error('방송사 API 접근이 브라우저에서 차단됐습니다(CORS). TOKEN_PROXY 설정이 필요합니다.'); }
  if(!res.ok) throw new Error('방송사 API 응답 오류 (' + res.status + ')');
  return res.text();
}
function pickM3u8(t){
  const m = t.replace(/\\\//g,'/').match(/https?:\/\/[^\s"'<>]+?\.m3u8[^\s"'<>]*/);
  return m ? m[0].replace(/&amp;/g,'&') : null;
}
// SBS·MBC는 매번 토큰이 붙은 주소를 새로 받아야 재생됩니다(토큰 약 2시간 유효)
async function resolveUrl(ch){
  if(ch.type === 'kbs'){
    const j = JSON.parse(await getText(ch.url));
    const u = j && j.channel_item && j.channel_item[0] && j.channel_item[0].service_url;
    if(!u) throw new Error('KBS 스트림 주소를 가져오지 못했습니다.');
    return u;
  }
  if(ch.type === 'sbs'){
    const u = pickM3u8(await getText(`https://apis.sbs.co.kr/play-api/1.0/livestream/${ch.url}/info?protocol=hls&ssl=Y`));
    if(!u) throw new Error('SBS 재생 주소(토큰)를 받지 못했습니다.');
    return u;
  }
  if(ch.type === 'mbc'){
    const t = await getText(`https://mediaapi.imbc.com/Player/OnAirURLUtil?type=m&ch=${ch.url}`);
    if(/GEO\s*Block/i.test(t)) throw new Error('MBC가 해외 접속으로 판단해 차단했습니다(국내 IP 필요).');
    const u = pickM3u8(t);
    if(!u) throw new Error('MBC 재생 주소(토큰)를 받지 못했습니다.');
    return u;
  }
  if(ch.type === 'stvp') return 'https://jmp2.uk/stvp-' + ch.url;
  return ch.url;
}
function showErr(title, msg){
  const ph = $('ph'), vid = $('vid');
  ph.hidden = false; vid.hidden = true;

}

  });

  for (const [gName, items] of Object.entries(groupsMap)) {
    let tabName = '한국 TV';
    if (gName.includes('지상파')) tabName = '한국-지상파';
    else if (gName.includes('종합편성')) tabName = '한국-종합편성';
    else if (gName.includes('영화')) tabName = '한국-영화';
    else if (gName.includes('기타')) tabName = '한국-기타';

    let targetTab = DATA.find(t => t.tab === tabName);
    if (!targetTab) {
      targetTab = { tab: tabName, groups: [] };
      DATA.push(targetTab);
    }

    let targetGroup = targetTab.groups.find(g => g.g === gName);
    if (!targetGroup) {
      targetGroup = { g: gName, items: [] };
      targetTab.groups.push(targetGroup);
    }

    targetGroup.items.push(...items);
  }
}

setupM3uData();

let curTab = DATA[0].tab;
let curCh = null;
let hlsInst = null;
let favs = JSON.parse(localStorage.getItem('mw_favs') || '[]');

const $ = id => document.getElementById(id);

function initClock() {
  const update = () => {
    const d = new Date();
    $('clock').textContent = d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' }) + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  };
  update();
  setInterval(update, 1000);
}

function initTabs() {
  const tabsNav = $('tabs');
  tabsNav.innerHTML = '';
  DATA.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t.tab === curTab ? ' on' : '');
    btn.textContent = t.tab;
    btn.onclick = () => {
      curTab = t.tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      renderList();
    };
    tabsNav.appendChild(btn);
  });
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function toggleFav(id) {
  if (favs.includes(id)) {
    favs = favs.filter(x => x !== id);
    showToast('즐겨찾기에서 해제되었습니다.');
  } else {
    favs.push(id);
    showToast('즐겨찾기에 추가되었습니다.');
  }
  localStorage.setItem('mw_favs', JSON.stringify(favs));
  renderList();
  if (curCh && curCh.id === id) updateFavBtn();
}

function updateFavBtn() {
  const isFav = curCh && favs.includes(curCh.id);
  $('pFav').textContent = isFav ? '★ 즐겨찾기' : '☆ 즐겨찾기';
  if (isFav) $('pFav').classList.add('on');
  else $('pFav').classList.remove('on');
}

async function playChannel(ch) {
  curCh = ch;
  $('pcol').hidden = false;
  $('layout').classList.add('has-player');
  $('pName').textContent = ch.name;
  $('pSub').textContent = ch.group || '';
  updateFavBtn();

  const vid = $('vid');
  const frm = $('frm');
  const ph = $('ph');

  vid.hidden = true;
  frm.hidden = true;
  ph.hidden = false;
  ph.innerHTML = '<div class="spin"></div><h4>채널 로딩 중...</h4>';

  if (hlsInst) {
    hlsInst.destroy();
    hlsInst = null;
  }
  vid.pause();
  vid.onerror = null;
  vid.removeAttribute('src');
  frm.src = '';

  let playUrl = ch.url;
  if (ch.type !== 'yt') {
    try { playUrl = await resolveUrl(ch); }
    catch (e) { showErr('재생 실패', e.message); return; }
    if (curCh !== ch) return; // 로딩 중 다른 채널을 누른 경우
    if (TOKEN_PROXY && /^(sbs|mbc|kbs)$/.test(ch.type)) playUrl = TOKEN_PROXY + '?stream=' + encodeURIComponent(playUrl);
  }
  const rawUrl = playUrl;

  if (ch.type === 'yt') {
    ph.hidden = true;
    frm.hidden = false;
    frm.src = `https://www.youtube.com/embed/live_stream?channel=${ch.url}&autoplay=1`;
  } else {
    ph.hidden = true;
    vid.hidden = false;
    if (Hls.isSupported()) {
      hlsInst = new Hls({ enableWorker: true });
      hlsInst.loadSource(playUrl);
      hlsInst.attachMedia(vid);
      hlsInst.on(Hls.Events.MANIFEST_PARSED, () => {
        vid.play().catch(() => {});
      });
      hlsInst.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          if (!data.response?.code && /manifestLoadError|levelLoadError|fragLoadError/.test(data.details || '') && TOKEN_PROXY && ch.type === 'stvp' && !rawUrl.includes('?stream=')) {
            hlsInst.destroy(); hlsInst = null;
            hlsInst = new Hls({ enableWorker: true });
            hlsInst.loadSource(TOKEN_PROXY + '?stream=' + encodeURIComponent(rawUrl));
            hlsInst.attachMedia(vid);
            hlsInst.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
            hlsInst.on(Hls.Events.ERROR, (e2, d2) => { if (d2.fatal) showErr('재생 오류', 'Worker를 거쳐도 삼성 TV 채널을 받지 못했습니다. <br><small>(' + d2.details + ')</small>'); });
            return;
          }
          if (!data.response?.code && /manifestLoadError/.test(data.details || '') && !rawUrl.includes('?stream=') && vid.canPlayType('application/vnd.apple.mpegurl')) {
            hlsInst.destroy(); hlsInst = null;
            vid.src = rawUrl; vid.play().catch(() => {});
            vid.onerror = () => showErr('재생 오류', '방송사 서버가 이 사이트에서의 재생을 막았습니다(CORS). TOKEN_PROXY(Worker) 설정이 필요합니다.');
            return;
          }
          const code = data.response && data.response.code;
          let why = '스트림을 재생할 수 없습니다.';
          if (code === 403 || code === 401) why = '방송사가 접근을 거부했습니다(토큰 만료·해외 IP·리퍼러 제한).';
          else if (code === 404) why = '스트림 주소가 더 이상 존재하지 않습니다.';
          else if (data.details && /manifestLoadError|fragLoadError/.test(data.details) && !code) why = TOKEN_PROXY ? 'Worker를 거쳐도 받지 못했습니다. Worker 주소·배포 상태를 확인하세요.' : '방송사 서버가 이 사이트에서의 재생을 막았습니다(CORS). TOKEN_PROXY(Worker) 설정이 필요합니다.';
          showErr('재생 오류', why + ' <br><small>(' + (data.details || data.type) + ')</small>');
        }
      });
    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = playUrl;
      vid.play().catch(() => {});
    } else {
      ph.hidden = false;
      vid.hidden = true;
      ph.innerHTML = '<h4>재생 불가</h4><p>이 브라우저는 HLS 재생을 지원하지 않습니다.</p>';
    }
  }
  renderList();
}

function closePlayer() {
  if (hlsInst) {
    hlsInst.destroy();
    hlsInst = null;
  }
  const vid = $('vid');
  vid.pause();
  vid.src = '';
  $('frm').src = '';
  $('pcol').hidden = true;
  $('layout').classList.remove('has-player');
  curCh = null;
  renderList();
}

function renderList() {
  const list = $('list');
  const query = $('q').value.trim().toLowerCase();
  list.innerHTML = '';

  let allChannels = [];
  DATA.forEach(t => {
    if (curTab === '즐겨찾기' || t.tab === curTab) {
      t.groups.forEach(g => {
        g.items.forEach(item => {
          allChannels.push({
            id: item[0],
            name: item[1],
            type: item[2],
            url: item[3],
            status: item[4],
            logo: item[5] || '',
            group: g.g,
            tab: t.tab
          });
        });
      });
    }
  });

  if (curTab === '즐겨찾기') {
    allChannels = [];
    DATA.forEach(t => {
      t.groups.forEach(g => {
        g.items.forEach(item => {
          if (favs.includes(item[0])) {
            allChannels.push({
              id: item[0],
              name: item[1],
              type: item[2],
              url: item[3],
              status: item[4],
              logo: item[5] || '',
              group: g.g,
              tab: t.tab
            });
          }
        });
      });
    });
  }

  if (query) {
    allChannels = allChannels.filter(c => c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query));
  }

  if (allChannels.length === 0) {
    list.innerHTML = '<div class="empty">채널이 없습니다.</div>';
    return;
  }

  const groups = {};
  allChannels.forEach(c => {
    if (!groups[c.group]) groups[c.group] = [];
    groups[c.group].push(c);
  });

  for (const [gName, chs] of Object.entries(groups)) {
    const gDiv = document.createElement('div');
    gDiv.className = 'group';

    const gHead = document.createElement('div');
    gHead.className = 'g-head';
    gHead.innerHTML = `<h3>${gName}</h3><span>(${chs.length})</span>`;
    gDiv.appendChild(gHead);

    const grid = document.createElement('div');
    grid.className = 'grid';

    chs.forEach(ch => {
      const isSelected = curCh && curCh.id === ch.id;
      const isFav = favs.includes(ch.id);
      const card = document.createElement('button');
      card.className = 'ch' + (isSelected ? ' on' : '');

      let logoImg = ch.logo ? `<img src="${ch.logo}" alt="" onerror="this.style.display='none'">` : '';

      card.innerHTML = `
        <div class="ch-top">
          ${logoImg}
          <div class="ch-n">${ch.name}</div>
        </div>
        <div class="ch-m">
          <span class="bd s-free">FREE</span>
          <span class="bd t-${ch.type === 'yt' ? 'yt' : 'hls'}">${ch.type === 'stvp' ? 'SAMSUNG' : ch.type.toUpperCase()}</span>
        </div>
        ${isFav ? '<span class="star">★</span>' : ''}
      `;

      card.onclick = () => playChannel(ch);
      grid.appendChild(card);
    });

    gDiv.appendChild(grid);
    list.appendChild(gDiv);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (!window.Hls) {
    $('cdnBanner').hidden = false;
  }
  initClock();
  initTabs();
  renderList();

  $('q').addEventListener('input', renderList);

  $('favTop').onclick = () => {
    curTab = '즐겨찾기';
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
    renderList();
  };

  $('pClose').onclick = closePlayer;

  $('pFav').onclick = () => {
    if (curCh) toggleFav(curCh.id);
  };

  $('pMute').onclick = () => {
    const vid = $('vid');
    vid.muted = !vid.muted;
    $('pMute').textContent = vid.muted ? '🔇 음소거' : '🔊 소리';
  };

  $('pFull').onclick = () => {
    const vid = $('vid');
    if (vid.requestFullscreen) vid.requestFullscreen();
    else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
  };
});
</script>
