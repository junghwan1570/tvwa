<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1018">
<title>명왕사신TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script src="canvasplay.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b1018;--sf:#121924;--card:#151d29;--card2:#1b2433;--bdr:#243042;--tx:#eef2f8;--tx2:#9aa6b8;--tx3:#5f6b7d;--acc:#b8f03c;--acc-d:#1a2a12;--acc-b:#3d5a1f;--red:#ff5a5a;--top:64px;--nav:72px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--tx);font:16px/1.45 'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;padding:0 max(16px,env(safe-area-inset-right)) calc(var(--nav) + 16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}

/* 앱 모드: 영상은 화면 뒤의 앱 플레이어가 그리므로 플레이어 칸과 바탕을 투명하게 */
html.app,html.app body{background:transparent}
html.app .player{background:transparent}

/* 상단 */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--bg)}
.logo{width:42px;height:42px;flex:none}
.brand{font-size:24px;font-weight:900;letter-spacing:-.5px;white-space:nowrap}
.brand b{color:var(--acc);font-weight:900}
.sp{flex:1}
.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:12px}
.icon:active{background:var(--card2)}
.icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:29;background:var(--bg);padding-bottom:10px}
.search input{width:100%;min-height:50px;background:var(--sf);border:1px solid var(--bdr);border-radius:14px;padding:0 18px;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}

/* 레이아웃 */
.wrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.left,.right{min-width:0}
@media(min-width:1000px){.wrap{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}.left{position:sticky;top:calc(var(--top) + env(safe-area-inset-top) + 4px)}}
.left{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

/* 플레이어 */
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:22px;overflow:hidden;border:1px solid var(--bdr)}
.player:fullscreen{border-radius:0;border:0}
.player video,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.player canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.ph{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#121a26,#000 75%)}
.ph h4{font-size:19px;font-weight:700}
.ph p{color:var(--tx2);font-size:14px;max-width:460px}
.ph small{color:var(--tx3)}
.spin{width:42px;height:42px;border:3px solid #263142;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{min-height:50px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;background:var(--acc);color:#10180a}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bdr)}

.ov{position:absolute;z-index:3;transition:opacity .25s}
.player.idle .ov{opacity:0;pointer-events:none}
.player.msg .ov-tl,.player.msg .ov-bc,.player.msg .ov-bl{display:none}
.ov-tl{top:16px;left:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100% - 32px)}
.chip-ov{background:rgba(10,14,20,.86);border-radius:14px;padding:8px 14px;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip-ov.sm{font-weight:500;font-size:14px;padding:6px 12px;border-radius:12px}
.ov-bl{left:16px;bottom:16px}.ov-br{right:16px;bottom:16px}
.ov-bc{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px}
.cbtn{width:56px;height:56px;border-radius:18px;background:rgba(10,14,20,.86);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.cbtn svg{width:24px;height:24px;fill:currentColor}
.cbtn.st svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.pill{min-width:100px;height:52px;padding:0 20px;border-radius:999px;background:rgba(10,14,20,.86);border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:16px;white-space:nowrap}
.pill:active,.cbtn:active{background:var(--acc);color:#10180a}

/* 현재 채널 카드 */
.now{display:flex;gap:18px;align-items:center;background:var(--acc-d);border:1px solid var(--acc-b);border-radius:22px;padding:18px 22px}
.n-logo{width:84px;height:84px;flex:none;border-radius:50%;background:#0e1610;border:1px solid var(--acc-b);display:grid;place-items:center;overflow:hidden;font-size:28px;font-weight:900;color:var(--acc)}
.n-logo img{width:70%;height:70%;object-fit:contain}
.n-body{flex:1;min-width:0}
.n-head{display:flex;align-items:baseline;gap:10px}
.n-name{flex:1;min-width:0;font-size:24px;font-weight:900;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-clock{font-size:22px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.n-line{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden}
.n-line span{overflow:hidden;text-overflow:ellipsis}
.dot{width:16px;height:16px;flex:none;border-radius:50%;background:var(--tx)}
.dot.live{background:var(--red);box-shadow:0 0 0 4px rgba(255,90,90,.2)}
.dot.o{background:none;border:2px solid var(--tx3)}
.bar{height:5px;border-radius:3px;background:#24331a;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.n-line.sub{font-size:16px;font-weight:500;color:var(--tx2);margin-top:0}

/* 카테고리 칩 */
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:52px;padding:0 24px;border-radius:999px;background:var(--card);border:1px solid var(--bdr);font-size:17px;font-weight:500;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#10180a;font-weight:700}

/* 채널 목록 */
.list{display:grid;gap:10px;margin-top:12px;grid-template-columns:minmax(0,1fr)}
.row{content-visibility:auto;contain-intrinsic-size:auto 84px;display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:14px 14px 14px 18px;text-align:left;min-height:84px}
.row:active{background:var(--card2)}
.row.on{border-color:var(--acc);background:var(--acc-d)}
.r-no{width:30px;flex:none;color:var(--tx3);font-size:17px;font-variant-numeric:tabular-nums}
.r-logo{width:56px;height:36px;flex:none;display:grid;place-items:center}
.r-logo img{max-width:100%;max-height:100%;object-fit:contain}
.r-logo b{width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:15px;color:var(--tx2)}
.r-body{flex:1;min-width:0}
.r-name{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .r-name{color:var(--acc)}
.r-sub{font-size:13px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.r-star{width:48px;height:48px;flex:none;display:grid;place-items:center;font-size:26px;color:var(--tx3);border-radius:12px}
.r-star.on{color:var(--acc)}
.r-play{width:56px;height:56px;flex:none;border-radius:50%;background:var(--card2);border:1px solid var(--bdr);display:grid;place-items:center}
.r-play svg{width:22px;height:22px;fill:currentColor;margin-left:3px}
.row.on .r-play{background:var(--acc);color:#10180a;border-color:var(--acc)}
.empty{color:var(--tx3);text-align:center;padding:56px 0;font-size:16px}

/* 목록 속 편성 */
.r-prog{display:block;font-size:14px;color:var(--tx);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-prog.nx{color:var(--tx3);font-size:13px;margin-top:1px}
.r-prog b{font-weight:500;color:var(--tx2);font-variant-numeric:tabular-nums;margin-right:6px}
.row.on .r-prog b{color:var(--acc)}
@media(min-width:1300px){.r-body{display:grid;grid-template-columns:minmax(120px,.9fr) minmax(0,1.6fr);align-items:center;gap:14px}.r-prog{margin:0}}

/* 유튜브 인기 */
.ytcats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ytcats::-webkit-scrollbar{display:none}
.ytcat{flex:none;min-height:42px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--bdr);color:var(--tx2);font-size:15px}
.ytcat.on{background:var(--card2);border-color:var(--acc);color:var(--acc);font-weight:700}
.vrow{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:10px;text-align:left;content-visibility:auto;contain-intrinsic-size:auto 108px}
.vrow:active{background:var(--card2)}
.vrow.on{border-color:var(--acc);background:var(--acc-d)}
.v-th{position:relative;width:160px;flex:none;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.v-th img{width:100%;height:100%;object-fit:cover;display:block}
.v-th b{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.v-th b.live{background:#e5332a}
.v-rank{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.82);color:var(--acc);font-size:13px;font-weight:900;padding:1px 7px;border-radius:6px}
.v-body{flex:1;min-width:0}
.v-title{font-size:17px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vrow.on .v-title{color:var(--acc)}
.v-meta{font-size:13px;color:var(--tx3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){.v-th{width:128px}.v-title{font-size:15px}}

/* 편성표 */
.gwrap{display:grid;gap:10px}
.gnote{font-size:13px;color:var(--tx3)}
.guide{overflow:auto;border:1px solid var(--bdr);border-radius:18px;background:var(--card);max-height:calc(100vh - var(--top) - var(--nav) - 140px);position:relative;-webkit-overflow-scrolling:touch}
.g-in{position:relative}
.g-ruler{position:sticky;top:0;z-index:3;height:38px;background:#101722;border-bottom:1px solid var(--bdr)}
.g-ruler span{position:absolute;top:0;height:38px;line-height:38px;padding-left:8px;font-size:13px;color:var(--tx2);border-left:1px solid var(--bdr);font-variant-numeric:tabular-nums}
.g-row{content-visibility:auto;contain-intrinsic-size:auto 68px;position:relative;height:68px;border-bottom:1px solid var(--bdr)}
.g-ch{position:sticky;left:0;z-index:2;width:var(--chw,150px);height:100%;display:flex;align-items:center;gap:8px;padding:0 10px;background:#121a26;border-right:1px solid var(--bdr);font-weight:700;font-size:15px;text-align:left}
.g-ch img{width:36px;height:24px;object-fit:contain;flex:none}
.g-ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-ruler .g-corner{position:sticky;left:0;z-index:4;display:block;width:var(--chw,150px);height:38px;background:#101722;border-right:1px solid var(--bdr);padding:0;border-left:0}
.g-p{position:absolute;top:6px;bottom:6px;border-radius:10px;background:var(--card2);border:1px solid var(--bdr);padding:6px 10px;overflow:hidden;text-align:left;font-size:14px;line-height:1.3}
.g-p small{display:block;color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
.g-p span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-p.now{background:var(--acc-d);border-color:var(--acc-b)}
.g-p.now small{color:var(--acc)}
.g-p:active{background:var(--acc);color:#10180a}
.g-line{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:1;pointer-events:none}
.g-empty{padding:40px;text-align:center;color:var(--tx3)}

/* 하단 내비 */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0e141e;border-top:1px solid var(--bdr)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx2);font-size:15px;font-weight:500}
.bnav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.bnav button.on{color:var(--acc);font-weight:700}

/* 설정 */
.set{display:grid;gap:14px}
.set-card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:20px}
.set-card h3{font-size:17px;margin-bottom:6px}
.set-card p{font-size:14px;color:var(--tx2);margin-bottom:12px}
.set-card input{width:100%;min-height:50px;background:var(--sf);border:1px solid var(--bdr);border-radius:12px;padding:0 14px;font-size:15px;outline:none;margin-bottom:12px}
.set-card .acts{display:flex;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2838;border:1px solid var(--bdr);padding:12px 20px;border-radius:14px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

@media(max-width:640px){
  .ph{gap:8px;padding:14px}.ph h4{font-size:16px}.ph p{font-size:12px}.ph .btn{min-height:42px;padding:0 16px;font-size:14px}
  :root{--top:58px;--nav:66px}
  .brand{font-size:21px}.logo{width:36px;height:36px}
  .player{border-radius:16px}
  .ov-tl{top:10px;left:10px}.chip-ov{font-size:15px;padding:6px 11px}.chip-ov.sm{font-size:12px}
  .ov-bl{left:10px;bottom:10px}.ov-br{right:10px;bottom:10px}.ov-bc{bottom:10px;gap:6px}
  .cbtn{width:46px;height:46px;border-radius:14px}.pill{min-width:0;height:44px;padding:0 14px;font-size:14px}
  .now{padding:14px;gap:12px;border-radius:18px}.n-logo{width:60px;height:60px;font-size:20px}
  .n-name{font-size:19px}.n-clock{font-size:17px}.n-line{font-size:15px}.n-line.sub{font-size:13px}
  .chip{min-height:44px;padding:0 18px;font-size:15px}
  .row{min-height:72px;padding:10px 10px 10px 12px;gap:10px}.r-no{width:24px;font-size:14px}.r-logo{width:44px}
  .r-name{font-size:16px}.r-play{width:46px;height:46px}.r-star{width:40px;font-size:22px}
}
</style>
</head>
<body>

<header class="top">
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
    <path d="M17 6l7 7 7-7" stroke="#b8f03c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="4" y="13" width="40" height="30" rx="9" fill="#b8f03c"/>
    <rect x="9" y="18" width="24" height="20" rx="5" fill="#0b1018"/>
    <path d="M18 23v10l8-5z" fill="#b8f03c"/>
    <circle cx="38.5" cy="22" r="2.2" fill="#0b1018"/><circle cx="38.5" cy="30" r="2.2" fill="#0b1018"/>
  </svg>
  <div class="brand">명왕사신<b>TV</b></div>
  <div class="sp"></div>
  <button class="icon" id="bSearch" aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button class="icon" id="bMenu" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<div class="search" id="searchBar" hidden><input id="q" type="search" placeholder="채널 검색 (한국어·영문)" aria-label="채널 검색"></div>

<div class="wrap" id="liveView">
  <section class="left">
    <div class="player idle" id="player">
      <video id="vid" playsinline hidden></video>
      <canvas id="cvs" hidden></canvas>
      <iframe id="frm" hidden allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="ph" id="ph"></div>
      <div class="ov ov-tl">
        <div class="chip-ov" id="ovName">채널을 선택하세요</div>
        <div class="chip-ov sm" id="ovCount"></div>
      </div>
      <div class="ov ov-bl"><button class="cbtn" id="bPause" aria-label="일시정지"><svg viewBox="0 0 24 24" id="icPause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button></div>
      <div class="ov ov-bc">
        <button class="pill" id="bPrev">◀ 이전</button>
        <button class="pill" id="bNext">다음 ▶</button>
      </div>
      <div class="ov ov-br"><button class="cbtn st" id="bFull" aria-label="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    </div>

    <div class="now" id="now">
      <div class="n-logo" id="nLogo">TV</div>
      <div class="n-body">
        <div class="n-head"><div class="n-name" id="nName">명왕사신TV</div><div class="n-clock" id="nClock"></div></div>
        <div class="n-line"><i class="dot" id="nDot"></i><span id="nNow">목록에서 채널을 고르세요</span></div>
        <div class="bar"><i id="nBar"></i></div>
        <div class="n-line sub"><i class="dot o"></i><span id="nNext"></span></div>
      </div>
    </div>
  </section>

  <section class="right">
    <nav class="chips" id="chips"></nav>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="gwrap" id="guideView" hidden>
  <nav class="chips" id="gchips"></nav>
  <div class="gnote" id="gnote"></div>
  <div class="guide" id="guide"></div>
</div>

<div class="set" id="setView" hidden>
  <div class="set-card">
    <h3>중계 서버 (Cloudflare Worker)</h3>
    <p>SBS·MBC·삼성TV 재생이 막힐 때 거쳐 가는 주소입니다. 비우면 사용하지 않습니다.</p>
    <input id="proxyIn" type="url" placeholder="https://○○.workers.dev">
    <div class="acts"><button class="btn" id="proxySave">저장</button><button class="btn sec" id="proxyReset">기본값</button></div>
  </div>
  <div class="set-card">
    <h3>캔버스 재생</h3>
    <p>영상을 브라우저가 직접 풀어 캔버스에 그립니다. 주행 중에도 재생되고 방송사 원본 화질 그대로입니다. 안 되는 채널은 자동으로 예전 방식으로 재생합니다.</p>
    <div class="acts"><button class="btn" id="cvsToggle">켜짐</button></div>
  </div>
  <div class="set-card">
    <h3>즐겨찾기</h3>
    <p id="favInfo"></p>

const DEFAULT_PROXY = 'https://junghwan1570.synology.me:8443'; // 집 NAS 국내 중계
let TOKEN_PROXY = (()=>{ try { const v = localStorage.getItem('mw_proxy'); return v === null ? DEFAULT_PROXY : v; } catch { return DEFAULT_PROXY; } })();

async function getText(url, viaProxy){
  const u = viaProxy && TOKEN_PROXY ? TOKEN_PROXY + '?url=' + encodeURIComponent(url) : url;
  let res;
  try { res = await fetch(u, { cache:'no-store' }); }
  catch(e){ throw new Error(viaProxy ? '중계 서버에 연결하지 못했습니다.' : '방송사 API 접근이 브라우저에서 차단됐습니다(CORS).'); }
  if(!res.ok) throw new Error('방송사 API 응답 오류 (' + res.status + ')');
  return res.text();
}
function pickM3u8(t){
  const m = t.replace(/\\\//g,'/').match(/https?:\/\/[^\s"'<>]+?\.m3u8[^\s"'<>]*/);
  return m ? m[0].replace(/&amp;/g,'&') : null;
}
// SBS·MBC는 매번 토큰이 붙은 주소를 새로 받아야 재생됩니다(토큰 약 2시간 유효)
async function resolveUrl(ch, viaProxy){
  if(ch.type === 'kbs'){
    const j = JSON.parse(await getText(ch.url, viaProxy));
    const u = j && j.channel_item && j.channel_item[0] && j.channel_item[0].service_url;
    if(!u) throw new Error('KBS 스트림 주소를 가져오지 못했습니다.');
    return u;
  }
  if(ch.type === 'sbs'){
    const u = pickM3u8(await getText(`https://apis.sbs.co.kr/play-api/1.0/livestream/${ch.url}?protocol=hls&ssl=Y`, viaProxy));
    if(!u) throw new Error('SBS 재생 주소(토큰)를 받지 못했습니다.');
    return u;
  }
  if(ch.type === 'mbc'){
    const t = await getText(`https://mediaapi.imbc.com/Player/OnAirURLUtil?type=m&ch=${ch.url}`, viaProxy);
    if(/GEO\s*Block/i.test(t)) throw new Error('MBC가 해외 접속으로 판단해 차단했습니다(국내 IP 필요).');
    const u = pickM3u8(t);
    if(!u) throw new Error('MBC 재생 주소(토큰)를 받지 못했습니다.');
    return u;
  }
  if(ch.type === 'jtbc'){
    // JTBC 공식 온에어 API (국내 IP에서만 주소를 줌, 1080p까지)
    const t = await getText('https://api.jtbc.co.kr/v1/onair', viaProxy);
    let u = null;
    try { const j = JSON.parse(t); if (j.oversea === true || j.block === true) throw new Error('JTBC가 해외 접속으로 판단해 차단했습니다(국내 IP 필요).'); u = j.sources && j.sources.HLS && j.sources.HLS.HD && j.sources.HLS.HD.file; }
    catch (e) { if (/차단/.test(e.message)) throw e; }
    u = u || pickM3u8(t);
    if(!u) throw new Error('JTBC 재생 주소를 받지 못했습니다.');
    return u;
  }
  if(ch.type === 'soop'){
    // SOOP 생방송: 시청 토큰(AID) + 스트림 서버 주소 → auth_playlist.m3u8?aid=…
    const [bid, bno] = ch.url.split('|');
    const form = new URLSearchParams({ bid, bno, type: 'aid', pwd: '', player_type: 'html5', stream_type: 'common', quality: 'original', mode: 'landing', from_api: '0', is_revive: 'false' }).toString();
    const a = JSON.parse(await soopApi('https://live.sooplive.co.kr/afreeca/player_live_api.php?bjid=' + encodeURIComponent(bid), form));
    const aid = a && a.CHANNEL && a.CHANNEL.AID;
    if (!aid) throw new Error('SOOP 방송이 끝났거나 시청할 수 없습니다 (' + (a && a.CHANNEL ? a.CHANNEL.RESULT : '?') + ')');
    const s = JSON.parse(await soopApi('https://livestream-manager.sooplive.com/broad_stream_assign.html?return_type=gcp_cdn&use_cors=false&cors_origin_url=play.sooplive.com&broad_key=' + bno + '-common-original-hls'));
    if (!s.view_url) throw new Error('SOOP 스트림 주소를 받지 못했습니다');
    return s.view_url + '?aid=' + encodeURIComponent(aid);
  }
  if(ch.type === 'stvp') return 'https://jmp2.uk/stvp-' + ch.url;
  return ch.url;
}

// ───────── kr-iptv 재생목록 (내 GitHub: junghwan1570/kr-iptv, GitHub Actions가 4시간마다 갱신) ─────────
// 한국 채널(group-title이 '한국-'로 시작)만 쓰고, HTTPS 페이지에서 막히는 http:// 주소는 뺍니다(앱에서는 포함).
// SBS·MBC처럼 방송사 API로 매번 토큰을 받는 채널은 내장 방식을 그대로 씁니다.
const M3U_SRCS = [
  'https://raw.githubusercontent.com/junghwan1570/kr-iptv/main/kr.m3u',
  'https://cdn.jsdelivr.net/gh/junghwan1570/kr-iptv@main/kr.m3u'
];
const M3U_TTL = 60 * 60 * 1000; // 1시간마다 새로 확인
// 영상 암호 키를 KBS 로그인 세션에만 내줘서(키 요청 403) 검은 화면만 나오는 채널: KBS드라마, KBS조이
const M3U_BLOCK = /\/\/(kbsndrama|kbsnjoy)\.gscdn\.kbs\.co\.kr\//;
function parseKrM3u(text){
  if (!/^﻿?#EXTM3U/.test(text.trim())) throw new Error('M3U 형식이 아닙니다');
  const out = []; let inf = null;
  for (const line of text.split(/\r?\n/)) {
    const l = line.trim();
    if (!l) continue;
    if (l.startsWith('#EXTINF')) { inf = l; continue; }
    if (l.startsWith('#') || !inf) continue;
    const attr = k => { const m = inf.match(new RegExp(k + '="([^"]*)"')); return m ? m[1] : ''; };
    const nm = inf.match(/"\s*,([^"]*)$/) || inf.match(/,([^,]*)$/);
    const name = (nm ? nm[1] : attr('tvg-name')).trim();
    const group = attr('group-title');
    // 앱은 http 주소도 재생할 수 있어 함께 받음 (웹은 https만)
    if (name && group.startsWith('한국-') && (window.AppBridge ? /^https?:\/\//i : /^https:\/\//i).test(l)) out.push({ name, group, logo: attr('tvg-logo'), type: 'hls', url: l });
    inf = null;
  }
  return out;
}
function mergeM3u(parsed){
  const out = [], used = new Set();
  parsed.forEach(p => {
    const b = M3U_BUILTIN.find(x => x.name === p.name && x.group === p.group) || M3U_BUILTIN.find(x => x.name === p.name);
    let item = b && b.type !== 'hls' ? { ...b } : { id: b ? b.id : p.name, name: p.name, group: p.group, logo: p.logo || (b && b.logo) || '', type: 'hls', url: p.url };
    if (used.has(item.id)) item.id = item.id + '_' + item.group.replace('한국-', '');
    if (used.has(item.id)) return;
    used.add(item.id); out.push(item);
  });
  // 방송사 API로 재생하는 내장 채널은 재생목록에서 빠져도 유지
  M3U_BUILTIN.forEach(b => { if (b.type !== 'hls' && !used.has(b.id)) { used.add(b.id); out.push({ ...b }); } });
  return out;
}
let M3U_STATE = (() => { try { return JSON.parse(localStorage.getItem('mw_m3u') || 'null'); } catch { return null; } })();
let M3U_ITEMS = M3U_STATE && Array.isArray(M3U_STATE.items) && M3U_STATE.items.length >= 10 ? M3U_STATE.items : M3U_BUILTIN;
async function fetchM3u(){
  let last;
  for (const src of M3U_SRCS) {
    try {
      const r = await fetch(src, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const items = mergeM3u(parseKrM3u(await r.text()));
      if (items.length < 10) throw new Error('한국 채널이 너무 적습니다 (' + items.length + '개)');
      return items;
    } catch (e) { last = e; }
  }
  throw last || new Error('재생목록을 받지 못했습니다');
}
// 바뀐 게 있으면 true
async function refreshM3u(force){
  if (!force && M3U_STATE && M3U_STATE.items && Date.now() - M3U_STATE.t < M3U_TTL) return false;
  try {
    const items = await fetchM3u();
    const changed = JSON.stringify(items) !== JSON.stringify(M3U_ITEMS);
    M3U_STATE = { t: Date.now(), items, err: null };
    try { localStorage.setItem('mw_m3u', JSON.stringify(M3U_STATE)); } catch {}
    return changed;
  } catch (e) {
    M3U_STATE = { ...(M3U_STATE || { t: 0, items: null }), err: e.message };
    throw e;
  }
}

    if (!d.fatal || cur !== c) return;
    const code = d.response && d.response.code;
    const net = !code && /manifestLoadError|levelLoadError|fragLoadError/.test(d.details || '');
    hls.destroy(); hls = null;
    if (settled) { // 재생 도중 끊김: 처음부터 다시 연결
      return showErr('재생 끊김', `연결이 끊겼습니다. 다시 시도해 보세요.<br><small>(${esc(d.details || d.type)})</small>`);
    }
    if (net && direct && native) return nativePlay(url, c, ok, fail);
    fail(code === 403 || code === 401 ? `거부됨 ${code}` : code === 404 ? '주소 없음 404' : net ? '사이트 간 재생 차단(CORS)' : (d.details || d.type));
  });
}
vid.addEventListener('playing', () => { phHide(); idleSoon(); syncPause(); });
vid.addEventListener('pause', syncPause);
vid.addEventListener('loadedmetadata', () => { if (!hls && vid.videoHeight) setQ(vid.videoHeight); });
function syncPause(){
  const paused = cvp ? cvp.isPaused() : vid.paused;
  $('icPause').innerHTML = paused ? '<path d="M7 4l13 8-13 8z"/>' : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
}
function step(n){
  if (cur && cur.type === 'soop' && soopItems.length) {
    const i = soopItems.findIndex(v => 'soop:' + v.id === cur.id);
    const v = soopItems[((i < 0 ? 0 : i + n) % soopItems.length + soopItems.length) % soopItems.length];
    if (v) play(soopChannel(v));
    return;
  }
  if (cur && cur.type === 'ytv' && ytItems.length) {
    const i = ytItems.findIndex(v => 'yt:' + v.id === cur.id);
    const v = ytItems[((i < 0 ? 0 : i + n) % ytItems.length + ytItems.length) % ytItems.length];
    if (v) play(ytChannel(v));
    return;
  }
  const list = shown.length ? shown : ALL;
  const i = cur ? list.findIndex(x => x.id === cur.id) : -1;
  const c = list[((i < 0 ? 0 : i + n) % list.length + list.length) % list.length];
  if (c) { play(c); scrollToRow(c.id); }
}
function scrollToRow(id){
  const r = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if (r && window.innerWidth >= 1000) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// 화면 위 버튼 자동 숨김
let idleT;
function wake(){ player.classList.remove('idle'); idleSoon(); }
function idleSoon(){ clearTimeout(idleT); idleT = setTimeout(() => { if (cur && ph.hidden) player.classList.add('idle'); }, 3500); }
player.addEventListener('pointerdown', e => {
  if (player.classList.contains('idle')) { e.preventDefault(); e.stopPropagation(); wake(); }
  else idleSoon();
}, true);

// ───────── 화면 전환·설정 ─────────
function setView(v){
  view = v;
  document.querySelectorAll('.bnav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('liveView').hidden = v !== 'live';
  $('guideView').hidden = v !== 'guide';
  $('setView').hidden = v !== 'set';
  renderChips();
  if (v === 'live') { renderList(); updateNow(); }
  else if (v === 'guide') renderGuide(true);
  else updateSettings();
  window.scrollTo({ top: 0 });
}
function updateSettings(){
  $('proxyIn').value = TOKEN_PROXY;
  $('favInfo').textContent = `${favs.length}개 채널을 즐겨찾기했습니다.`;
  const withEpg = ALL.filter(c => progsOf(c)).length;
  $('epgInfo').textContent = EPG && EPG.t
    ? `${new Date(EPG.t * 1000).toLocaleString('ko-KR')} 기준 · 출처 ${(EPG.src || []).join(', ') || '없음'} · 편성 정보 있는 채널 ${withEpg}/${ALL.length}개` + (EPG.err && EPG.err.length ? ` · 실패: ${EPG.err.join(', ')}` : '')
    : '아직 편성표를 받지 못했습니다.' + (EPG && EPG.err ? ' ' + EPG.err.join(', ') : '');
  $('chInfo').textContent = `전체 ${ALL.length}개 · ` + TABS.map(t => [t, ALL.filter(c => c.tab === t).length]).filter(x => x[1]).map(x => `${x[0]} ${x[1]}`).join(' · ');
  $('m3uInfo').textContent = 'kr-iptv 재생목록: ' + (M3U_STATE && M3U_STATE.items
    ? `${new Date(M3U_STATE.t).toLocaleString('ko-KR')} 받음 · 한국 채널 ${M3U_STATE.items.length}개`
    : '아직 받지 못해 앱 내장 목록을 씁니다') + (M3U_STATE && M3U_STATE.err ? ` · 최근 실패: ${M3U_STATE.err}` : '');
}
let toastT;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

// ───────── 이벤트 ─────────
function chipClick(e){
  const b = e.target.closest('.chip'); if (!b) return;
  chip = b.dataset.t; renderChips();
  if (view === 'guide') renderGuide(true); else { renderList(); updateNow(); }
  const same = e.currentTarget.querySelector(`.chip.on`); if (same) same.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}
$('chips').onclick = chipClick;
$('gchips').onclick = chipClick;
$('list').onclick = e => {
  if (e.target.closest('[data-ytre]')) { ytState = ''; delete ytMem[ytCat]; renderYt(); return; }
  const yc = e.target.closest('[data-ytcat]');
  if (yc) { ytCat = yc.dataset.ytcat; store.set('mw_ytcat', ytCat); ytState = ''; renderYt(); return; }
  if (e.target.closest('[data-soopre]')) { soopState = ''; renderSoop(); loadSoop(true).then(() => chip === SOOP && renderSoop()); return; }
  const sv = e.target.closest('[data-soop]');
  if (sv) { const v = soopItems.find(x => x.id === sv.dataset.soop); if (v) { play(soopChannel(v)); if (window.innerWidth < 1000) window.scrollTo({ top: 0, behavior: 'smooth' }); } return; }
  const yv = e.target.closest('[data-yt]');
  if (yv) { const v = ytItems.find(x => x.id === yv.dataset.yt); if (v) { play(ytChannel(v)); if (window.innerWidth < 1000) window.scrollTo({ top: 0, behavior: 'smooth' }); } return; }
  const f = e.target.closest('[data-fav]'); if (f) { e.stopPropagation(); return toggleFav(f.dataset.fav); }
  const r = e.target.closest('.row'); if (!r) return;
  const c = ALL.find(x => x.id === r.dataset.id); if (c) { play(c); if (window.innerWidth < 1000) window.scrollTo({ top: 0, behavior: 'smooth' }); }
};
$('guide').onclick = e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  const c = ALL.find(x => x.id === b.dataset.id); if (!c) return;
  setView('live'); play(c); scrollToRow(c.id);
};
document.querySelector('.bnav').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
$('bMenu').onclick = () => setView(view === 'set' ? 'live' : 'set');
$('bSearch').onclick = () => { const s = $('searchBar'); s.hidden = !s.hidden; if (!s.hidden) $('q').focus(); else { $('q').value = ''; query = ''; refreshAll(); } };
$('q').oninput = () => { query = $('q').value.trim().toLowerCase(); if (view === 'set') setView('live'); else refreshAll(); };
$('bPrev').onclick = () => step(-1);
$('bNext').onclick = () => step(1);
$('bPause').onclick = () => { if (!cur) return; if (cvp) { cvp.setPaused(!cvp.isPaused()); syncPause(); return; } vid.paused ? vid.play().catch(() => {}) : vid.pause(); };
$('bFull').onclick = () => {
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (player.requestFullscreen) player.requestFullscreen();
  else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
  else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
};
$('proxySave').onclick = () => { TOKEN_PROXY = $('proxyIn').value.trim().replace(/\/+$/, ''); try { localStorage.setItem('mw_proxy', TOKEN_PROXY); } catch {} toast('저장했습니다'); loadEpg(true); };
$('proxyReset').onclick = () => { TOKEN_PROXY = DEFAULT_PROXY; try { localStorage.removeItem('mw_proxy'); } catch {} updateSettings(); toast('기본값으로 되돌렸습니다'); loadEpg(true); };
function showCanvasBtn(){
  const b = $('cvsToggle'); if (!b) return;
  if (!CANVAS_OK) { b.textContent = '이 브라우저는 지원하지 않음'; b.disabled = true; b.className = 'btn sec'; return; }
  b.textContent = canvasOn ? '켜짐' : '꺼짐'; b.className = canvasOn ? 'btn' : 'btn sec';
}
showCanvasBtn();
$('cvsToggle').onclick = () => { canvasOn = !canvasOn; store.set('mw_canvas', canvasOn); showCanvasBtn(); toast(canvasOn ? '캔버스 재생을 켰습니다' : '예전 방식(동영상)으로 재생합니다'); if (cur) play(cur); };
$('favClear').onclick = () => { if (!favs.length || !confirm('즐겨찾기를 모두 삭제할까요?')) return; favs = []; store.set('mw_favs', favs); updateSettings(); toast('삭제했습니다'); };
$('epgReload').onclick = async () => { $('epgInfo').textContent = '받는 중…'; await loadEpg(true); updateSettings(); toast('편성표를 새로 받았습니다'); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') step(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') step(-1);
});

// 재생목록을 새로 받아 채널 목록에 반영 (재생 중인 채널은 끊지 않음)
async function syncM3u(force){
  let changed = null;
  try {
    changed = await refreshM3u(force);
    if (changed) {
      M3U_ITEMS = M3U_STATE.items;
      setupM3uData(M3U_ITEMS);
      ALL = buildChannels();
      buildIdx(); renderChips();
      if (view === 'live') { renderList(); updateNow(); } else refreshAll();
    }
  } catch (e) {}
  if (view === 'set') updateSettings();
  return changed;
}
$('m3uReload').onclick = async () => {
  $('m3uInfo').textContent = '받는 중…';
  const r = await syncM3u(true);
  toast(r === null ? '채널 목록을 받지 못했습니다' : r ? '채널 목록을 새로 반영했습니다' : '이미 최신 채널 목록입니다');
};

// ───────── 안드로이드 앱 모드 (명왕사신TV 앱 안에서 열렸을 때) ─────────
// 앱이 window.AppBridge를 넣어 줌: 영상은 앱의 ExoPlayer가 재생하고, 이 화면은 목록·편성표·조작을 맡음.
const APP = !!window.AppBridge;
if (APP) {
  document.documentElement.classList.add('app');
  const AB = window.AppBridge;
  let reqSeq = 0, pending = null, nativePaused = false, nativeOn = false, retries = 0;
  // 앱 진단 기록 (설정 화면에 보임) — 폰에서 무엇이 실패했는지 확인용
  const appLog = [];
  window.__appLog = (m) => {
    const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
    appLog.unshift(`${t} ${m}`); if (appLog.length > 40) appLog.pop();
    const el = $('appLogBox'); if (el) el.textContent = appLog.join('\n');
  };
  addEventListener('error', (e) => window.__appLog('JS 오류: ' + (e.message || e)));

  // 방송사 토큰 API는 앱이 직접 받음 (휴대폰 국내 IP, CORS 없음) → NAS 중계 없이도 MBC 재생
  getText = async function (url) {
    let res;
    try { res = await fetch('https://relay.app/?url=' + encodeURIComponent(url), { cache: 'no-store' }); }
    catch (e) { throw new Error('방송사 API에 연결하지 못했습니다.'); }
    if (!res.ok) throw new Error('방송사 API 응답 오류 (' + res.status + ')');
    return res.text();
  };
  // 토큰 주소 보관(5분) → 같은 채널로 돌아올 때·미리 받아 둔 이웃 채널은 바로 재생
  const urlCache = new Map();
  const resolveRaw = resolveUrl;
  resolveUrl = async function (s) {
    const key = s.type + '|' + s.url;
    const hit = urlCache.get(key);
    if (hit && Date.now() - hit.t < 5 * 60e3) return hit.u;
    const u = await resolveRaw(s, false);
    urlCache.set(key, { u, t: Date.now() });
    return u;
  };
  function prefetchNeighbors(){
    const list = shown.length ? shown : ALL;
    const i = cur ? list.findIndex(x => x.id === cur.id) : -1;
    if (i < 0) return;
    [list[(i + 1) % list.length], list[(i - 1 + list.length) % list.length]].forEach(c => {
      const s = c && c.sources && c.sources[0];
      if (s && /^(sbs|mbc|kbs|jtbc)$/.test(s.type)) resolveUrl(s).catch(() => {});
    });
  }
  modesFor = () => ['dd'];
  MODE_NAME.dd = '앱 재생';

  function refererFor(u){
    try {
      const h = new URL(u).hostname;
      if (/(^|\.)sbs\.co\.kr$/.test(h)) return 'https://www.sbs.co.kr/';
      if (/(^|\.)imbc\.com$/.test(h)) return 'https://onair.imbc.com/';
      if (/(^|\.)kbs\.co\.kr$/.test(h)) return 'https://onair.kbs.co.kr/';
      if (/(^|\.)jtbc\.co\.kr$/.test(h)) return 'https://onair.jtbc.co.kr/';
      if (/(^|\.)sooplive\.(com|co\.kr)$/.test(h)) return 'https://play.sooplive.com/';
    } catch {}
    return '';
  }
  startHls = function (url, c, direct, ok, fail) {
    const m = /[?&]stream=([^&]+)/.exec(url);
    if (m) url = decodeURIComponent(m[1]);
    const id = ++reqSeq;
    pending = { id, c, ok, fail, done: false, url };
    nativePaused = false;
    window.__appLog(`재생 요청: ${c.name} → ${url.replace(/\?.*/, '?…').slice(0, 90)}`);
    AB.play(url, refererFor(url), String(id));
    setTimeout(() => { if (pending && pending.id === id && !pending.done) { AB.stop(); pending.done = true; fail('20초 동안 화면이 나오지 않음'); } }, 20000);
  };
  // 앱이 보내는 재생 상태
  window.__appEvent = function (e) {
    if (!pending || String(pending.id) !== String(e.id)) return;
    const p = pending;
    if (e.t === 'ready') {
      nativeOn = true; retries = 0;
      window.__appLog(`재생 시작: ${p.c.name} (${e.h || '?'}p)`);
      if (!p.done) { p.done = true; p.ok(); }
      vid.hidden = true; cvs.hidden = true; phHide(); idleSoon(); syncPause();
      if (e.h) setQ(e.h);
      syncRect();
      prefetchNeighbors();
    } else if (e.t === 'size') {
      if (e.h) setQ(e.h);
    } else if (e.t === 'error') {
      nativeOn = false;
      window.__appLog(`재생 오류: ${p.c.name} · ${e.msg || ''}`);
      if (p.c.sources) p.c.sources.forEach(s => urlCache.delete(s.type + '|' + s.url)); // 토큰 만료 대비
      if (!p.done) { p.done = true; p.fail(e.msg || '재생 실패'); }
      else if (p.c === cur) {
        // 보던 중 끊김: 새 토큰으로 3번까지 조용히 다시 연결
        if (retries < 3) { retries++; toast(`다시 연결 중… (${retries}/3)`); setTimeout(() => { if (p.c === cur) play(cur); }, 800 * retries); }
        else { retries = 0; showErr('재생 끊김', esc(e.msg || '연결이 끊겼습니다.')); }
      }
    }
  };
  const stopWeb = stop;
  stop = function () { pending = null; nativeOn = false; AB.stop(); stopWeb(); };
  syncPause = function () {
    const paused = nativeOn ? nativePaused : (cvp ? cvp.isPaused() : vid.paused);
    $('icPause').innerHTML = paused ? '<path d="M7 4l13 8-13 8z"/>' : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  };
  $('bPause').onclick = () => {
    if (!cur) return;
    if (nativeOn) { nativePaused = !nativePaused; AB.setPaused(nativePaused); syncPause(); return; }
    vid.paused ? vid.play().catch(() => {}) : vid.pause();
  };
  $('bFull').onclick = () => { if (nativeOn) AB.setFullscreen(true); };
  // 영상 자리(플레이어 칸)의 위치를 앱에 알려 줌 → 앱이 그 자리에 영상을 그림
  let lastRect = '';
  function syncRect(){
    const r = player.getBoundingClientRect();
    const vis = !$('liveView').hidden && r.width > 0;
    const k = vis ? [r.left, r.top, r.width, r.height].map(v => Math.round(v * 10) / 10).join(',') : 'hidden';
    if (k === lastRect) return;
    lastRect = k;
    if (vis) AB.setRect(r.left, r.top, r.width, r.height); else AB.setRect(0, 0, 0, 0);
  }
  window.__syncRect = syncRect;
  $('appLogCard').hidden = false;
  addEventListener('scroll', syncRect, { passive: true });
  addEventListener('resize', syncRect);
  if (window.ResizeObserver) new ResizeObserver(syncRect).observe(player);
  setInterval(syncRect, 500);
  const setViewWeb = setView;
  setView = function (v) { setViewWeb(v); requestAnimationFrame(syncRect); };
  // 앱의 뒤로 가기: 편성표·설정이면 라이브로, 검색 중이면 닫기
  window.__appBack = function () {
    if (!$('searchBar').hidden) { $('bSearch').click(); return true; }
    if (view !== 'live') { setView('live'); return true; }
    return false;
  };
  // 전체화면에서 좌우로 밀면 채널 이동
  window.__appStep = function (n) { step(n); };
  window.__appChannelName = function () { return cur ? cur.name : ''; };
  const playWeb = play;
  play = function (c) {
    if (c && c.id && !/^(yt|soop):/.test(c.id) && AB.saveLast) { try { AB.saveLast(c.id); } catch {} }
    return playWeb(c);
  };
  window.__appLastId = function () { try { return (AB.getLast && AB.getLast()) || store.get('mw_last', null); } catch { return store.get('mw_last', null); } };
}

// ───────── 시작 ─────────
renderChips(); renderList(); updateNow();
setInterval(tick, 1000);
loadEpg(false);
setInterval(() => loadEpg(false), 10 * 60 * 1000);
syncM3u(false);
setInterval(() => syncM3u(false), M3U_TTL);
if (!window.Hls) toast('영상 라이브러리를 불러오지 못했습니다');
(() => {
  const last = ALL.find(c => c.id === store.get('mw_last', null));
  if (APP) {                                                         // 앱: 마지막 채널 바로 재생
    const id = window.__appLastId();
    const lc = ALL.find(c => c.id === id) || last;
    window.__appLog('앱 시작 · 마지막 채널: ' + (lc ? lc.name : '없음'));
    if (lc) { play(lc); setTimeout(() => scrollToRow(lc.id), 300); return; }
  }
  if (last) {
    phShow(`<h4>최근 시청: ${esc(last.name)}</h4><p>${esc(last.group)}</p><button class="btn" id="resume">▶ 이어 보기</button>`);
    $('resume').onclick = () => play(last);
  } else phShow('<h4>명왕사신TV</h4><p>아래 목록에서 채널을 고르세요.</p>');
})();
</script>
</body>
</html>
