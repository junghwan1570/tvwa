<style>
:root{color-scheme:dark;--bg:#0a0a10;--sf:#12121a;--card:#1a1a24;--card-h:#222230;--bdr:#2a2a38;--tx:#e8e8f0;--tx2:#8888a0;--tx3:#5a5a70;--red:#e53e3e;--grn:#38d67a;--amb:#f0b429;--blu:#4da6ff;--yt:#ff4444;--glow:0 0 20px rgba(229,62,62,.15)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:16px/1.5 'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 85%,transparent);padding-top:14px;padding-bottom:6px}
.top{display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:26px;letter-spacing:-.5px;white-space:nowrap;text-shadow:0 0 24px rgba(229,62,62,.3)}.brand b{color:var(--red)}
.clock{font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
#q{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bdr);color:var(--tx);border-radius:14px;padding:12px 18px;font:inherit;font-size:16px;outline:none;min-height:52px}
#q:focus{border-color:var(--red);box-shadow:var(--glow)}
.ib{background:var(--sf);border:1px solid var(--bdr);border-radius:14px;min-width:52px;min-height:52px;padding:0 16px;white-space:nowrap;font-size:18px}
.ib:active{background:var(--card-h)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px;border-bottom:1px solid var(--bdr)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 18px 10px;color:var(--tx2);font-weight:500;font-size:16px;white-space:nowrap;min-height:52px;transition:color .15s}
.tab.on{color:var(--tx);border-bottom-color:var(--red);font-weight:700}
.tab:active{color:var(--tx)}
.banner{margin-top:10px;background:#ff5a5a1a;border:1px solid #ff5a5a55;color:#ffb3b3;border-radius:14px;padding:12px 16px;font-size:14px}

.layout{display:grid;gap:20px;padding:16px 0 28px}
@media(min-width:900px){.layout.has-player{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.layout.has-player .pcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);align-self:start}}
.player{background:var(--sf);border:1px solid var(--bdr);border-radius:18px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.p-frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.p-frame video,.p-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:radial-gradient(ellipse,#14141c,#000 72%);z-index:2}
.ph .spin{width:40px;height:40px;border:3px solid #2a2a3a;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ph h4{font-size:18px;font-weight:700}
.ph p{color:var(--tx2);font-size:14px;max-width:460px;line-height:1.6}
.ph .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ph .go{background:var(--red);border:0;color:#fff;border-radius:14px;padding:0 24px;font-weight:700;min-height:52px;font-size:15px}
.ph .go.sec{background:var(--card);border:1px solid var(--bdr);color:var(--tx)}
.p-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.p-title{flex:1;min-width:0}
.p-title h2{font-size:20px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{display:block;color:var(--tx3);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:0 16px;min-height:48px;font-size:14px;color:var(--tx2);white-space:nowrap;transition:background .1s}
.pb:active{background:var(--card-h)}
.pb.fav.on{color:var(--amb);border-color:#e8b33a55}
.pb.on{color:var(--tx);border-color:var(--tx2)}

.group{margin-bottom:24px}
.g-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.g-head h3{font-size:17px;font-weight:700}
.g-head span{font-size:12px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.layout.has-player .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ch{position:relative;display:flex;flex-direction:column;gap:8px;justify-content:space-between;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px;min-height:90px;text-align:left;transition:background .12s,border-color .12s,box-shadow .12s;min-width:0;-webkit-tap-highlight-color:transparent}
.ch:active{background:var(--card-h)}
.ch.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red),var(--glow)}
.ch-top{display:flex;gap:10px;align-items:center;min-width:0;padding-right:16px}
.ch-top img{width:32px;height:32px;object-fit:contain;border-radius:6px;background:#ffffff0a;flex:none}
.ch-n{font-size:15px;font-weight:700;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch-m{display:flex;gap:5px;flex-wrap:wrap}
.ch .star{position:absolute;top:10px;right:10px;font-size:13px;color:var(--amb)}
.bd{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;letter-spacing:.2px;white-space:nowrap;font-style:normal}
.s-free{background:#38d67a1a;color:var(--grn)}
.t-hls{background:#4da6ff1a;color:var(--blu)}.t-yt{background:#ff44441a;color:var(--yt)}
.empty{color:var(--tx3);text-align:center;padding:48px 0;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1e1e2a;border:1px solid var(--bdr);color:var(--tx);padding:12px 20px;border-radius:14px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{opacity:1}
footer{color:var(--tx3);font-size:12px;text-align:center;padding:16px 0 24px;border-top:1px solid var(--bdr)}
@media(max-width:640px){.clock{display:none}.brand{font-size:22px}.grid,.layout.has-player .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ch{min-height:82px;padding:12px}.p-title{flex-basis:100%}.p-title h2{font-size:18px}.pb{flex:1}}
</style>

</header>

        <div class="ph" id="ph"></div>
      </div>
      <div class="p-bar">
        <div class="p-title"><h2 id="pName"></h2><small id="pSub"></small></div>
        <button class="pb" id="pMute">🔊 소리</button>

        <button class="pb" id="pFull">전체화면</button>
        <button class="pb" id="pClose">✕ 목록</button>
      </div>
    </section>
  </div>
  <main id="list"></main>
</div>
<footer>명왕사신TV</footer>
<div class="toast" id="toast"></div>

function setupM3uData() {
  const groupsMap = {};
  M3U_ITEMS.forEach(item => {
    if (!groupsMap[item.group]) {
      groupsMap[item.group] = [];
    }
    groupsMap[item.group].push([
      item.id,
      item.name,
      item.type,
      item.url,
      'free',
      item.logo
    ]);
  });

  for (const [gName, items] of Object.entries(groupsMap)) {
    let tabName = '한국 TV';
    if (gName.includes('지상파')) tabName = '한국-지상파';
    else if (gName.includes('종합편성')) tabName = '한국-종합편성';
    else if (gName.includes('영화')) tabName = '한국-영화';
    else if (gName.includes('기타')) tabName = '한국-기타';

    let targetTab = DATA.find(t => t.tab === tabName);
    if (!targetTab) {
      targetTab = { tab: tabName, groups: [] };
      DATA.push(targetTab);
    }

    let targetGroup = targetTab.groups.find(g => g.g === gName);
    if (!targetGroup) {
      targetGroup = { g: gName, items: [] };
      targetTab.groups.push(targetGroup);
    }

    targetGroup.items.push(...items);
  }
}

setupM3uData();

let curTab = DATA[0].tab;
let curCh = null;
let hlsInst = null;
let favs = JSON.parse(localStorage.getItem('mw_favs') || '[]');

const $ = id => document.getElementById(id);

function initClock() {
  const update = () => {
    const d = new Date();
    $('clock').textContent = d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' }) + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  };
  update();
  setInterval(update, 1000);
}

function initTabs() {
  const tabsNav = $('tabs');
  tabsNav.innerHTML = '';
  DATA.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t.tab === curTab ? ' on' : '');
    btn.textContent = t.tab;
    btn.onclick = () => {
      curTab = t.tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      renderList();
    };
    tabsNav.appendChild(btn);
  });
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function toggleFav(id) {
  if (favs.includes(id)) {
    favs = favs.filter(x => x !== id);
    showToast('즐겨찾기에서 해제되었습니다.');
  } else {
    favs.push(id);
    showToast('즐겨찾기에 추가되었습니다.');
  }
  localStorage.setItem('mw_favs', JSON.stringify(favs));
  renderList();
  if (curCh && curCh.id === id) updateFavBtn();
}

function updateFavBtn() {
  const isFav = curCh && favs.includes(curCh.id);
  $('pFav').textContent = isFav ? '★ 즐겨찾기' : '☆ 즐겨찾기';
  if (isFav) $('pFav').classList.add('on');
  else $('pFav').classList.remove('on');
}

async function playChannel(ch) {
  curCh = ch;
  $('pcol').hidden = false;
  $('layout').classList.add('has-player');
  $('pName').textContent = ch.name;
  $('pSub').textContent = ch.group || '';
  updateFavBtn();

  const vid = $('vid');
  const frm = $('frm');
  const ph = $('ph');

  vid.hidden = true;
  frm.hidden = true;
  ph.hidden = false;
  ph.innerHTML = '<div class="spin"></div><h4>채널 로딩 중...</h4>';

  if (hlsInst) {
    hlsInst.destroy();
    hlsInst = null;
  }
  vid.pause();
  vid.src = '';
  frm.src = '';

  let playUrl = ch.url;

  if (ch.type === 'kbs') {
    try {
      const res = await fetch(ch.url);
      const json = await res.json();
      if (json && json.channel_item && json.channel_item[0] && json.channel_item[0].service_url) {
        playUrl = json.channel_item[0].service_url;
      }
    } catch (e) {
      ph.innerHTML = '<h4>재생 실패</h4><p>KBS 스트림 주소를 가져오지 못했습니다.</p>';
      return;
    }
  }

  if (ch.type === 'yt') {
    ph.hidden = true;
    frm.hidden = false;
    frm.src = `https://www.youtube.com/embed/live_stream?channel=${ch.url}&autoplay=1`;
  } else {
    ph.hidden = true;
    vid.hidden = false;
    if (Hls.isSupported()) {
      hlsInst = new Hls({ enableWorker: true });
      hlsInst.loadSource(playUrl);
      hlsInst.attachMedia(vid);
      hlsInst.on(Hls.Events.MANIFEST_PARSED, () => {
        vid.play().catch(() => {});
      });
      hlsInst.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          ph.hidden = false;
          vid.hidden = true;
          ph.innerHTML = '<h4>재생 오류</h4><p>스트림을 재생할 수 없습니다.</p>';
        }
      });
    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = playUrl;
      vid.play().catch(() => {});
    } else {
      ph.hidden = false;
      vid.hidden = true;
      ph.innerHTML = '<h4>재생 불가</h4><p>이 브라우저는 HLS 재생을 지원하지 않습니다.</p>';
    }
  }
  renderList();
}

function closePlayer() {
  if (hlsInst) {
    hlsInst.destroy();
    hlsInst = null;
  }
  const vid = $('vid');
  vid.pause();
  vid.src = '';
  $('frm').src = '';
  $('pcol').hidden = true;
  $('layout').classList.remove('has-player');
  curCh = null;
  renderList();
}

function renderList() {
  const list = $('list');
  const query = $('q').value.trim().toLowerCase();
  list.innerHTML = '';

  let allChannels = [];
  DATA.forEach(t => {
    if (curTab === '즐겨찾기' || t.tab === curTab) {
      t.groups.forEach(g => {
        g.items.forEach(item => {
          allChannels.push({
            id: item[0],
            name: item[1],
            type: item[2],
            url: item[3],
            status: item[4],
            logo: item[5] || '',
            group: g.g,
            tab: t.tab
          });
        });
      });
    }
  });

  if (curTab === '즐겨찾기') {
    allChannels = [];
    DATA.forEach(t => {
      t.groups.forEach(g => {
        g.items.forEach(item => {
          if (favs.includes(item[0])) {
            allChannels.push({
              id: item[0],
              name: item[1],
              type: item[2],
              url: item[3],
              status: item[4],
              logo: item[5] || '',
              group: g.g,
              tab: t.tab
            });
          }
        });
      });
    });
  }

  if (query) {
    allChannels = allChannels.filter(c => c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query));
  }

  if (allChannels.length === 0) {
    list.innerHTML = '<div class="empty">채널이 없습니다.</div>';
    return;
  }

  const groups = {};
  allChannels.forEach(c => {
    if (!groups[c.group]) groups[c.group] = [];
    groups[c.group].push(c);
  });

  for (const [gName, chs] of Object.entries(groups)) {
    const gDiv = document.createElement('div');
    gDiv.className = 'group';

    const gHead = document.createElement('div');
    gHead.className = 'g-head';
    gHead.innerHTML = `<h3>${gName}</h3><span>(${chs.length})</span>`;
    gDiv.appendChild(gHead);

    const grid = document.createElement('div');
    grid.className = 'grid';

    chs.forEach(ch => {
      const isSelected = curCh && curCh.id === ch.id;
      const isFav = favs.includes(ch.id);
      const card = document.createElement('button');
      card.className = 'ch' + (isSelected ? ' on' : '');

      let logoImg = ch.logo ? `<img src="${ch.logo}" alt="" onerror="this.style.display='none'">` : '';

      card.innerHTML = `
        <div class="ch-top">
          ${logoImg}
          <div class="ch-n">${ch.name}</div>
        </div>
        <div class="ch-m">
          <span class="bd s-free">FREE</span>
          <span class="bd t-${ch.type === 'yt' ? 'yt' : 'hls'}">${ch.type.toUpperCase()}</span>
        </div>
        ${isFav ? '<span class="star">★</span>' : ''}
      `;

      card.onclick = () => playChannel(ch);
      grid.appendChild(card);
    });

    gDiv.appendChild(grid);
    list.appendChild(gDiv);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (!window.Hls) {
    $('cdnBanner').hidden = false;
  }
  initClock();
  initTabs();
  renderList();

  $('q').addEventListener('input', renderList);

  $('favTop').onclick = () => {
    curTab = '즐겨찾기';
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
    renderList();
  };

  $('pClose').onclick = closePlayer;

  $('pFav').onclick = () => {
    if (curCh) toggleFav(curCh.id);
  };

  $('pMute').onclick = () => {
    const vid = $('vid');
    vid.muted = !vid.muted;
    $('pMute').textContent = vid.muted ? '🔇 음소거' : '🔊 소리';
  };

  $('pFull').onclick = () => {
    const vid = $('vid');
    if (vid.requestFullscreen) vid.requestFullscreen();
    else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
  };
});
