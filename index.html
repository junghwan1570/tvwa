<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TVwa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--sf:#141418;--card:#1b1b21;--card-h:#24242c;--bdr:#2b2b33;--tx:#ececf0;--tx2:#9a9aa3;--tx3:#6a6a73;--red:#e82127;--grn:#3ccf6e;--amb:#e8b33a;--blu:#5aa2ff;--yt:#ff4646}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap}.brand b{color:var(--red)}
.clock{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
#q{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bdr);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;outline:none}
#q:focus{border-color:var(--red)}
.ib{background:var(--sf);border:1px solid var(--bdr);border-radius:10px;min-width:44px;min-height:44px;padding:0 12px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px;border-bottom:1px solid var(--bdr)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;color:var(--tx2);font-weight:500;white-space:nowrap;min-height:46px}
.tab.on{color:var(--tx);border-bottom-color:var(--red);font-weight:700}
.banner{margin-top:10px;background:#ff5a5a1a;border:1px solid #ff5a5a55;color:#ffb3b3;border-radius:10px;padding:10px 14px;font-size:13px}

.layout{display:grid;gap:18px;padding:16px 0 24px}
@media(min-width:1000px){.layout.has-player{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.layout.has-player .pcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);align-self:start}}
.player{background:var(--sf);border:1px solid var(--bdr);border-radius:14px;overflow:hidden}
.p-frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.p-frame video,.p-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:radial-gradient(ellipse,#17171c,#000 72%);z-index:2}
.ph .spin{width:34px;height:34px;border:3px solid #2a2a32;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ph h4{font-size:16px}
.ph p{color:var(--tx2);font-size:13px;max-width:460px;line-height:1.55}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ph .go{background:var(--red);border:0;color:#fff;border-radius:10px;padding:0 20px;font-weight:700;min-height:46px}
.ph .go.sec{background:var(--card);border:1px solid var(--bdr);color:var(--tx)}
.p-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.p-title{flex:1;min-width:0}
.p-title h2{font-size:18px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{display:block;color:var(--tx3);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:0 13px;min-height:44px;font-size:13px;color:var(--tx2);white-space:nowrap}
.pb:hover{color:var(--tx)}
.pb.fav.on{color:var(--amb);border-color:#e8b33a55}
.pb.on{color:var(--tx);border-color:var(--tx2)}

.group{margin-bottom:22px}
.g-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.g-head h3{font-size:15px;font-weight:700}
.g-head span{font-size:11px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.layout.has-player .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ch{position:relative;display:flex;flex-direction:column;gap:8px;justify-content:space-between;background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:12px;min-height:84px;text-align:left;transition:background .12s,border-color .12s;min-width:0}
.ch:hover{background:var(--card-h)}
.ch.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.ch.off{opacity:.55}
.ch-top{display:flex;gap:8px;align-items:center;min-width:0;padding-right:14px}
.ch-top img{width:28px;height:28px;object-fit:contain;border-radius:5px;background:#ffffff0d;flex:none}
.ch-n{font-size:14.5px;font-weight:700;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch-o{font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-m{display:flex;gap:4px;flex-wrap:wrap}
.ch .star{position:absolute;top:8px;right:9px;font-size:12px;color:var(--amb)}
.bd{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.2px;white-space:nowrap;font-style:normal}
.s-free{background:#3ccf6e1f;color:var(--grn)}.s-login{background:#e8b33a1f;color:var(--amb)}.s-paid{background:#ff5a5a1f;color:#ff7a7a}
.t-hls{background:#5aa2ff1f;color:var(--blu)}.t-yt{background:#ff46461f;color:var(--yt)}.t-link{background:#ffffff10;color:var(--tx2)}
.v-ok{background:#3ccf6e1f;color:var(--grn)}.v-fail{background:#ff5a5a1f;color:#ff7a7a}.v-none{background:#ffffff0c;color:var(--tx3)}.v-block{background:#ffffff0c;color:#c98a8a}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:5px}
.custom{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.custom input{flex:1;min-width:0;background:var(--sf);border:1px dashed var(--bdr);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;font-size:13px;outline:none}
.custom input:focus{border-color:var(--blu);border-style:solid}
.ibar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:flex;background:var(--sf);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:0 14px;min-height:44px;color:var(--tx2)}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:700}
.sel{background:var(--sf);border:1px solid var(--bdr);border-radius:10px;min-height:44px;padding:0 10px;max-width:100%;color:var(--tx)}
.istat{font-size:12px;color:var(--tx2);margin-bottom:14px;line-height:1.6}
.istat.err{color:#ff9a9a}
.istat b{color:var(--tx)}
.more{display:block;margin:12px auto 0;min-width:200px}
.empty{color:var(--tx3);text-align:center;padding:40px 0}
.ch.sp{padding:0 0 10px;gap:5px;overflow:hidden}
.ch.sp img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
.ch.sp .ch-n,.ch.sp .ch-m{padding:0 10px}
.sp-t{padding:0 10px;font-size:11.5px;color:var(--tx2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#26262e;border:1px solid var(--bdr);color:var(--tx);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
footer{color:var(--tx3);font-size:11px;text-align:center;padding:14px 0 22px;border-top:1px solid var(--bdr)}
@media(max-width:640px){.clock{display:none}.brand{font-size:19px}.grid,.layout.has-player .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.ch{min-height:78px;padding:10px}.p-title{flex-basis:100%}.p-title h2{font-size:16px}.pb{flex:1}}
</style>
</head>

<header>
  <div class="top">
    <div class="brand"><b>TV</b>wa</div>
    <div class="clock" id="clock"></div>
    <input id="q" type="search" placeholder="채널 검색 (한국어·영문)" aria-label="채널 검색">
    <button class="ib" id="favTop" title="즐겨찾기">★</button>
  </div>

  <nav class="tabs" id="tabs"></nav>
</header>

<div class="layout" id="layout">
  <div class="pcol" id="pcol" hidden>
    <section class="player">
      <div class="p-frame" id="pframe">
        <video id="vid" playsinline hidden></video>
        <iframe id="frm" hidden allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div class="ph" id="ph"></div>
      </div>
      <div class="p-bar">
        <div class="p-title"><h2 id="pName"></h2><small id="pSub"></small></div>
        <button class="pb" id="pMute">🔊 소리</button>
        <button class="pb fav" id="pFav">☆ 즐겨찾기</button>
        <button class="pb" id="pPage" hidden>공식 페이지 ↗</button>
        <button class="pb" id="pFull">전체화면</button>
        <button class="pb" id="pClose">✕ 목록</button>
      </div>
    </section>
  </div>
  <main id="list"></main>
</div>
<footer>TVwa · 방송사 공식 플레이어·공개 스트림·iptv-org 공개 목록·YouTube 공식 채널만 연결 · DRM·인증·지역 제한 우회 없음 · 정차 중에만 시청하세요</footer>

function parseExtinf(line){
  const body=line.replace(/^#EXTINF:/i,'');
  // 첫 번째 '따옴표 밖' 쉼표 뒤가 채널명
  let q=false,cut=-1;
  for(let i=0;i<body.length;i++){const ch=body[i];if(ch==='"')q=!q;else if(ch===','&&!q){cut=i;break}}
  const head=cut<0?body:body.slice(0,cut),title=cut<0?'':body.slice(cut+1).trim();
  const attrs={};head.replace(/([\w-]+)="([^"]*)"/g,(m,k,v)=>{attrs[k.toLowerCase()]=v;return m});
  return{attrs,title};
}
function parseM3U(text){
  if(typeof text!=='string'||!/^\s*#EXTM3U/i.test(text))throw Object.assign(new Error('M3U 형식이 아닙니다 (#EXTM3U 없음)'),{kind:'format'});
  const out=[];let inf=null,opts=[];
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(/^#EXTINF/i.test(l)){inf=parseExtinf(l);opts=[];continue}
    if(/^#(EXTVLCOPT|KODIPROP|EXTHTTP)/i.test(l)){opts.push(l);continue}
    if(l[0]==='#')continue;
    if(!/^https?:\/\//i.test(l)){inf=null;continue}
    const a=inf?inf.attrs:{},title=inf?inf.title:l;
    const res=(title.match(/\((\d{3,4}p)\)/)||[])[1]||'';
    const flags=(title.match(/\[[^\]]+\]/g)||[]).map(s=>s.slice(1,-1));
    const clean=title.replace(/\s*\([^)]*\)|\s*\[[^\]]*\]/g,'').trim()||title;
    const tid=a['tvg-id']||'';const cc=((tid.match(/\.([a-z]{2})(?:@|$)/i)||[])[1]||'').toLowerCase();
    const groups=(a['group-title']||'Undefined').split(';').map(s=>s.trim()).filter(Boolean);
    const o=opts.slice();['http-referrer','http-user-agent'].forEach(k=>{if(a[k])o.push(k+'='+a[k])});
    out.push({name:clean,raw:title,url:l,logo:a['tvg-logo']||'',tvgId:tid,country:cc,groups,res,flags,opts:o,key:normName(title)});
    inf=null;opts=[];
  }
  return out;
}

const BUILTIN=[];DATA.forEach(t=>t.groups.forEach(g=>g.items.forEach(a=>BUILTIN.push({id:a[0],n:a[1],t:a[2]==='web'?'link':a[2],u:a[3],s:a[4],v:a[5],tab:t.tab,g:g.g,src:'tvwa'}))));
const BY={};BUILTIN.forEach(c=>BY[c.id]=c);
const ORIG={};BUILTIN.forEach(c=>ORIG[c.id]={t:c.t,u:c.u});
let EXT=ls.get('tvwa.ext',{});          // 즐겨찾기·최근 시청한 IPTV 채널 보관
Object.values(EXT).forEach(c=>{if(!BY[c.id])BY[c.id]=c});
const IP={scope:'kr',lists:{kr:null,all:null},meta:{kr:null,all:null},err:{kr:null,all:null},loading:{kr:false,all:false},country:'',cat:'',vf:'',shown:120};

function toChannel(it,scope){
  const ko=KO[it.key]||'';
  return{id:'ip-'+hashId(normUrl(it.url)),n:ko||it.name,o:ko?it.name:'',t:'hls',u:it.url,s:'free',logo:it.logo,cc:it.country,cats:it.groups,res:it.res,flags:it.flags,opts:it.opts,key:it.key,g:'iptv-org',tab:'IPTV',src:'iptv',scope};
}
function mergeIPTV(items,scope){
  // 기존 링크 채널을 원상태로 되돌린 뒤(새로고침 대비) 다시 보강
  if(scope==='kr')BUILTIN.forEach(c=>{if(c.src==='tvwa+iptv'){c.t=ORIG[c.id].t;c.u=ORIG[c.id].u;c.page=null;c.src='tvwa'}});
  const urlSet=new Map(BUILTIN.map(c=>[normUrl(c.u),c]));
  const keyMap={};Object.entries(MATCH).forEach(([id,keys])=>keys.forEach(k=>keyMap[k]=id));
  const seen=new Set(),out=[];let dup=0;
  for(const it of items){
    const nu=normUrl(it.url);
    if(seen.has(nu)){dup++;continue}seen.add(nu);
    if(urlSet.has(nu)){dup++;continue}                       // 같은 주소 → 기존 채널 유지
    const ch=toChannel(it,scope);
    const bid=scope==='kr'||it.country==='kr'?keyMap[it.key]:null;
    if(bid&&BY[bid]){
      const b=BY[bid],vr=vGet(ch.u);
      // 실제 재생이 확인된 스트림만 기존 '공식 페이지' 채널의 재생 소스로 승격
      if(b.t==='link'&&!policyBlock(ch)&&vr&&vr.ok){b.page=ORIG[b.id].u;b.t='hls';b.u=ch.u;b.src='tvwa+iptv';dup++;continue}
      dup++;continue;   // 이름이 같은 기존 채널이 있으면 기존 채널 하나만 표시
    }
    out.push(ch);BY[ch.id]=ch;
  }
  return{list:out,dup};
}
async function loadIPTV(scope,force){
  if(IP.loading[scope])return;
  IP.loading[scope]=true;IP.err[scope]=null;if(tab==='IPTV')render();
  const cacheKey='tvwa.m3u.'+scope;
  if(!IP.lists[scope]&&!force){const c=ls.get(cacheKey,null);if(c&&c.text){try{applyList(scope,c.text,c.at,true)}catch(e){}}}
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),scope==='all'?60000:20000);
    let r;try{r=await fetch(IPTV_SRC[scope],{signal:ctl.signal,cache:'no-cache'})}catch(e){clearTimeout(to);throw Object.assign(new Error(e.name==='AbortError'?'응답 시간 초과':'네트워크 오류 또는 CORS 차단 — 인터넷 연결을 확인하세요'),{kind:'net'})}
    clearTimeout(to);
    if(!r.ok)throw Object.assign(new Error('HTTP '+r.status+' 응답'),{kind:'http'});
    const text=await r.text();
    applyList(scope,text,Date.now(),false);
    if(!ls.set(cacheKey,{text,at:Date.now()})&&scope==='kr')console.warn('목록 캐시 저장 실패');
  }catch(e){
    IP.err[scope]=e.message+(IP.lists[scope]?' — 이전에 불러온 목록을 계속 사용합니다':'');
  }finally{IP.loading[scope]=false;if(tab==='IPTV'||$('#q').value.trim())render()}
}
function applyList(scope,text,at,fromCache){
  const items=parseM3U(text);
  const {list,dup}=mergeIPTV(items,scope);
  IP.lists[scope]=list;
  IP.meta[scope]={total:items.length,dup,blocked:list.filter(c=>policyBlock(c)).length,at,fromCache};
}

  const sc=$('#ipScope');if(sc)sc.onclick=e=>{const b=e.target.closest('button');if(!b)return;IP.scope=b.dataset.s;IP.shown=120;if(!IP.lists[IP.scope])loadIPTV(IP.scope);render()};

function ipFiltered(){
  const L=IP.lists[IP.scope]||[];
  return L.filter(c=>{
    if(IP.scope==='all'&&IP.country&&c.cc!==IP.country)return false;
    if(IP.cat&&!(c.cats||[]).includes(IP.cat))return false;
    if(IP.vf){const b=policyBlock(c),r=vGet(c.u);
      if(IP.vf==='ok'&&!(r&&r.ok))return false;
      if(IP.vf==='playable'&&b)return false;
      if(IP.vf==='fail'&&!(b||(r&&!r.ok)))return false;
      if(IP.vf==='none'&&(b||r))return false;}
    return true});
}
function renderIPTV(){
  const S=IP.scope,L=IP.lists[S],M=IP.meta[S];
  const opt=(v,l,sel)=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`;
  let h=`<div class="ibar"><div class="seg" id="ipScope"><button data-s="kr" class="${S==='kr'?'on':''}">한국</button><button data-s="all" class="${S==='all'?'on':''}">전체 국가</button></div>`;
  if(L){

      h+=`<select class="sel" id="ipCountry" aria-label="국가">${opt('','모든 국가',IP.country)}${cs.map(c=>opt(c,regionName(c)+' ('+L.filter(x=>x.cc===c).length+')',IP.country)).join('')}</select>`}
    const cats=[...new Set(L.flatMap(c=>c.cats||[]))].sort();
    h+=`<select class="sel" id="ipCat" aria-label="카테고리">${opt('','모든 카테고리',IP.cat)}${cats.map(c=>opt(c,CAT_KO[c]||c,IP.cat)).join('')}</select>`;
    h+=`<select class="sel" id="ipVf" aria-label="재생 상태">${opt('','모든 상태',IP.vf)}${opt('ok','✓ 재생 확인만',IP.vf)}${opt('playable','제외 숨기기',IP.vf)}${opt('none','미검증',IP.vf)}${opt('fail','실패·제외',IP.vf)}</select>`;
  }
  h+=`<button class="pb" id="ipRefresh"${IP.loading[S]?' disabled':''}>${IP.loading[S]?'불러오는 중…':'↻ 새로고침'}</button>`;
  if(L)h+=`<button class="pb${checking?' on':''}" id="ipCheck">${checking?`점검 중지 (${checking.done}/${checking.total})`:'▶ 이 목록 재생 점검'}</button>`;
  h+='</div>';
  if(M){const t=new Date(M.at);h+=`<div class="istat">iptv-org <b>${S==='kr'?'한국':'전체'}</b> 목록 <b>${M.total.toLocaleString()}</b>개 · 기존 채널과 중복 정리 <b>${M.dup}</b>개 · 정책 제외 <b>${M.blocked}</b>개 · ${t.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} ${M.fromCache?'(저장된 목록)':'불러옴'}<br>원본: ${esc(IPTV_SRC[S])}</div>`}
  if(IP.err[S])h+=`<div class="istat err">목록을 불러오지 못했습니다: ${esc(IP.err[S])} <button class="pb" id="ipRetry">다시 시도</button></div>`;
  if(!L)return h+(IP.loading[S]?`<div class="empty">${S==='all'?'전체 목록(수 MB)을 받는 중…':'한국 목록을 받는 중…'}</div>`:(IP.err[S]?'':'<div class="empty">목록이 없습니다</div>'));
  const F=ipFiltered();
  h+=F.length?groupHTML(S==='kr'?'iptv-org 한국 채널':'iptv-org 채널',F.slice(0,IP.shown),F.length>IP.shown?`${IP.shown}개 표시 중`:''):'<div class="empty">조건에 맞는 채널이 없습니다</div>';
  if(F.length>IP.shown)h+=`<button class="pb more" id="ipMore">더 보기 (${(F.length-IP.shown).toLocaleString()}개 남음)</button>`;
  return h;
}

function startCheck(list){
  if(!list.length){toast('점검할 채널이 없습니다');return}
  checking={total:list.length,done:0,ok:0,stop:false};render();
  const q=list.slice(),box=document.createElement('div');box.style.cssText='position:fixed;left:-9999px;top:0;width:320px;height:180px;overflow:hidden';document.body.appendChild(box);
  const worker=()=>new Promise(res=>{const next=()=>{if(!checking||checking.stop||!q.length)return res();const c=q.shift();const v=document.createElement('video');v.muted=true;v.playsInline=true;v.width=320;box.appendChild(v);
    runStream(c,v,{muted:true,timeout:15000,onOk:info=>{vSet(c.u,{ok:true,r:info.r});fin(true)},onFail:info=>{vSet(c.u,Object.assign({ok:false},info));fin(false)}});
    function fin(ok){try{v.pause();v.removeAttribute('src');v.load()}catch(e){}v.remove();if(checking){checking.done++;if(ok)checking.ok++;render()}next()}};next()});
  Promise.all([worker(),worker(),worker()]).then(()=>{box.remove();const r=checking;checking=null;render();if(r)toast(`점검 완료: ${r.done}개 중 ${r.ok}개 재생 확인`)});
}
function stopCheck(){if(checking)checking.stop=true}

/* ===================== 13. SOOP ===================== */
let soop=null,soopAt=0;
function loadSoop(force){
  if(soop&&!force&&Date.now()-soopAt<120000)return Promise.resolve(soop);
  return new Promise(res=>{
    const cb='__soop'+Date.now();const s=document.createElement('script');
    const done=d=>{delete window[cb];s.remove();if(d&&d.broad){soop=d.broad.filter(b=>b.broad_grade!=='19'&&b.is_password!=='Y'&&b.subscription_only!=='1').slice(0,60);soopAt=Date.now()}res(soop)};
    window[cb]=done;s.onerror=()=>done(null);setTimeout(()=>window[cb]&&done(null),8000);
    s.src=`https://live.sooplive.com/api/main_broad_list_api.php?callback=${cb}&selectType=action&selectValue=all&orderType=view_cnt&pageNo=1&lang=`;
    document.head.appendChild(s);
  });
}
function soopCard(b){
  const c={id:'soop-'+b.user_id,n:b.user_nick,t:'link',u:`https://play.sooplive.com/${encodeURIComponent(b.user_id)}`,s:'free',g:'SOOP',tab:'SOOP'};BY[c.id]=c;
  const v=(+b.current_view_cnt||0)+(+b.m_current_view_cnt||0);
  return`<button class="ch sp" data-id="${esc(c.id)}"><img loading="lazy" alt="" src="https:${esc(b.broad_thumb)}"><span class="ch-n">${esc(b.user_nick)}</span><span class="sp-t">${esc(b.broad_title)}</span><span class="ch-m"><i class="bd t-yt">● ${v.toLocaleString()}명</i><i class="bd t-link">새 탭 ↗</i></span></button>`;
}
function renderSoop(){
  $('#list').innerHTML='<div class="empty">SOOP 인기 방송 불러오는 중…</div>';
  loadSoop().then(list=>{
    if(tab!=='SOOP'||$('#q').value.trim())return;
    $('#list').innerHTML=list&&list.length
      ?`<section class="group"><div class="g-head"><h3>SOOP 인기 라이브</h3><span>시청자 순 · ${list.length}개</span><button class="pb" id="soopRe">새로고침</button></div><div class="grid">${list.map(soopCard).join('')}</div></section>`
      :'<div class="empty">SOOP 목록을 불러오지 못했습니다 <button class="pb" id="soopRe">다시 시도</button></div>';
    const r=$('#soopRe');if(r)r.onclick=()=>{loadSoop(true).then(renderSoop)};
  });
}

function tick(){$('#clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,20000);
if(!window.Hls)$('#cdnBanner').hidden=false;
renderTabs();render();
loadIPTV('kr');   // 한국 목록 기본 로드 → 기존 채널과 병합
window.TVWA={parseM3U,policyBlock,normUrl,normName,mergeIPTV,IP,BY,BUILTIN,vGet,startCheck,get checking(){return checking}};
