<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TVwa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--sf:#141418;--card:#1b1b21;--card-h:#24242c;--bdr:#2b2b33;--tx:#ececf0;--tx2:#9a9aa3;--tx3:#6a6a73;--red:#e82127;--grn:#3ccf6e;--amb:#e8b33a;--blu:#5aa2ff;--yt:#ff4646}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap}.brand b{color:var(--red)}
.clock{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
#q{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bdr);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;outline:none}
#q:focus{border-color:var(--red)}
.ib{background:var(--sf);border:1px solid var(--bdr);border-radius:10px;min-width:44px;min-height:44px;padding:0 12px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px;border-bottom:1px solid var(--bdr)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;color:var(--tx2);font-weight:500;white-space:nowrap;min-height:46px}
.tab.on{color:var(--tx);border-bottom-color:var(--red);font-weight:700}

.layout{display:grid;gap:18px;padding:16px 0 24px}
@media(min-width:1000px){.layout.has-player{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.layout.has-player .pcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);align-self:start}}
.pcol[hidden]{display:none}
.player{background:var(--sf);border:1px solid var(--bdr);border-radius:14px;overflow:hidden}
.p-frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.p-frame video,.p-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:radial-gradient(ellipse,#17171c,#000 72%);z-index:2}
.ph .spin{width:34px;height:34px;border:3px solid #2a2a32;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ph p{color:var(--tx2);font-size:13px;max-width:440px}
.ph .go{background:var(--red);border:0;color:#fff;border-radius:10px;padding:12px 20px;font-weight:700;min-height:46px}
.p-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.p-title{flex:1;min-width:0}
.p-title h2{font-size:18px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{display:block;color:var(--tx3);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:0 13px;min-height:42px;font-size:13px;color:var(--tx2)}
.pb:hover{color:var(--tx)}
.pb.fav.on{color:var(--amb);border-color:#e8b33a55}

.group{margin-bottom:22px}
.g-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.g-head h3{font-size:15px;font-weight:700}
.g-head span{font-size:11px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.layout.has-player .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ch{position:relative;display:flex;flex-direction:column;gap:8px;justify-content:space-between;background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:12px;min-height:84px;text-align:left;transition:background .12s,border-color .12s}
.ch:hover{background:var(--card-h)}
.ch.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.ch-n{font-size:14.5px;font-weight:700;line-height:1.3;padding-right:16px}
.ch-m{display:flex;gap:4px;flex-wrap:wrap}
.ch .star{position:absolute;top:8px;right:9px;font-size:12px;color:var(--amb)}
.bd{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.2px;white-space:nowrap}
.s-free{background:#3ccf6e1f;color:var(--grn)}.s-login{background:#e8b33a1f;color:var(--amb)}.s-paid{background:#ff5a5a1f;color:#ff7a7a}
.t-hls{background:#5aa2ff1f;color:var(--blu)}.t-yt{background:#ff46461f;color:var(--yt)}.t-web,.t-link{background:#ffffff10;color:var(--tx2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:5px}.legend i{font-style:normal}
.custom{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.custom input{flex:1;min-width:0;background:var(--sf);border:1px dashed var(--bdr);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;font-size:13px;outline:none}
.custom input:focus{border-color:var(--blu);border-style:solid}
.empty{color:var(--tx3);text-align:center;padding:40px 0}
.ch.sp{padding:0 0 10px;gap:5px;overflow:hidden}
.ch.sp img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
.ch.sp .ch-n,.ch.sp .ch-m{padding:0 10px}
.sp-t{padding:0 10px;font-size:11.5px;color:var(--tx2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-embed{background:#5aa2ff1f;color:var(--blu)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#26262e;border:1px solid var(--bdr);color:var(--tx);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--tx3);font-size:11px;text-align:center;padding:14px 0 22px;border-top:1px solid var(--bdr)}
@media(max-width:640px){.clock{display:none}.brand{font-size:19px}.grid,.layout.has-player .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.ch{min-height:78px;padding:10px}.p-title{flex-basis:100%}.p-title h2{font-size:16px}.pb{flex:1}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand"><b>TV</b>wa</div>
    <div class="clock" id="clock"></div>
    <input id="q" type="search" placeholder="채널 검색" aria-label="채널 검색">
    <button class="ib" id="favTop" title="즐겨찾기">★</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="layout" id="layout">
  <div class="pcol" id="pcol" hidden>
    <section class="player">
      <div class="p-frame">
        <video id="vid" controls playsinline hidden></video>
        <iframe id="frm" hidden allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div class="ph" id="ph"><div class="spin"></div><p id="phText">불러오는 중</p></div>
      </div>
      <div class="p-bar">
        <div class="p-title"><h2 id="pName"></h2><small id="pSub"></small></div>
        <button class="pb fav" id="pFav">☆ 즐겨찾기</button>
        <button class="pb" id="pOpen">새 탭 ↗</button>
        <button class="pb" id="pFull">전체화면</button>
        <button class="pb" id="pClose">✕</button>
      </div>
    </section>
  </div>
  <main id="list"></main>
</div>
<footer>TVwa · 방송사 공식 플레이어·공개 스트림·YouTube 공식 채널만 연결 · 정차 중에만 시청하세요</footer>
<div class="toast" id="toast"></div>

<script>
/* t: hls=직접재생 · yt=YouTube 라이브 · web=공식 플레이어 페이지 · link=새 탭 전용
   s: free=무료 · login=로그인 · paid=구독 */
const KBS=c=>'https://onair.kbs.co.kr/index.html?sname=onair&stype=live&ch_code='+c;
const EBS=p=>`https://ebsonair.ebs.co.kr/${p}familypc/familypc1m/playlist.m3u8`;
const DATA=[
 {tab:'공중파',groups:[
  {g:'KBS',items:[
   ['kbs1','KBS 1TV','web',KBS('11'),'free'],['kbs2','KBS 2TV','web',KBS('12'),'free'],
   ['kbsd','KBS Drama','web',KBS('N91'),'free'],['kbsj','KBS Joy','web',KBS('N92'),'free'],
   ['kbss','KBS Story','web',KBS('N94'),'free'],['kbsl','KBS Life','web',KBS('N93'),'free'],
   ['kbsk','KBS Kids','web',KBS('N96'),'free'],['kbsw','KBS World','web',KBS('14'),'free']]},
  {g:'MBC · SBS',items:[
   ['mbc','MBC','web','https://onair.imbc.com/','login'],['sbs','SBS','web','https://www.sbs.co.kr/live/S01','login'],
   ['obs','OBS 경인TV','web','https://www.obs.co.kr/onair/','free']]},
  {g:'EBS',note:'직접 재생',items:[
   ['ebs1','EBS 1TV','hls',EBS('groundwave'),'free'],['ebs2','EBS 2TV','hls',EBS('ebs2'),'free'],
   ['ebsk','EBS Kids','hls',EBS('ebsu'),'free'],['ebsp1','EBS Plus 1','hls',EBS('plus1'),'free'],
   ['ebsp2','EBS Plus 2','hls',EBS('plus2'),'free'],['ebse','EBS English','hls',EBS('plus3'),'free']]}]},
 {tab:'종편·케이블',groups:[
  {g:'종합편성',items:[
   ['jtbc','JTBC','web','https://onair.jtbc.co.kr/','free'],['mbn','MBN','web','https://www.mbn.co.kr/vod/onair','free'],
   ['tvch','TV조선','web','https://www.tvchosun.com/onair/index.html','free'],['cha','채널A','web','https://www.ichannela.com/','login']]},
  {g:'케이블 (TVING · wavve)',note:'구독 필요',items:[
   ['tvn','tvN','link','https://www.tving.com/live','paid'],['mnet','Mnet','link','https://www.tving.com/live','paid'],
   ['ocn','OCN','link','https://www.tving.com/live','paid'],['jtbc2','JTBC2','link','https://www.tving.com/live','paid'],
   ['mbcev','MBC every1','link','https://www.wavve.com/live','paid'],['sbsp','SBS Plus','link','https://www.wavve.com/live','paid']]}]},
 {tab:'뉴스',groups:[
  {g:'24시간 뉴스',items:[
   ['ytn','YTN','yt','UChlgI3UHCOnwUGzWzbJ3H5w','free','lpQTznAbLn0'],['ynh','연합뉴스TV','yt','UCTHCOPwqNfZ0uiKOvFyhGwg','free','ilvhUd2YgBI'],
   ['kbsn','KBS 뉴스24','yt','UCcQTRi69dsVYHN3exePtZ1A','free','I5UHI7p-zvI']]},
  {g:'방송사 뉴스 라이브',note:'특보·속보 라이브는 자주 바뀜',items:[
   ['mbcn','MBC 뉴스','yt','UCF4Wxdo3inmxP-Y59wXDsFw','free','m0wUTjsd7gw'],['sbsn','SBS 뉴스','yt','UCkinYTS9IHqOEwR1Sze2JTw','free','3n0ES_XiaPc'],
   ['jtbcn','JTBC 뉴스','yt','UCsU-I-vHLiaMfV_ceaYz5rQ','free','fqQAD_noR9E'],['tvcn','TV조선 뉴스','yt','UCWlV3Lz_55UaX4JsMj-z__Q','free','ao8KmYncnw8']]},
  {g:'공공',items:[
   ['ktv','KTV 국민방송','web','https://www.ktv.go.kr/','free'],['natv','국회방송','web','https://www.natv.go.kr/','free'],
   ['ari','Arirang TV','web','https://www.arirang.com/v/live','free']]}]},
 {tab:'지역방송',groups:[
  {g:'SBS 계열 지역민방',note:'방송사 자체 서버',items:[
   ['knn','KNN 부산경남','hls','https://stream1.knn.co.kr/hls/9ly4534y7dm2xfa123r2_tv/index.m3u8','free'],
   ['kbc','KBC 광주','hls','https://vod.ikbc.co.kr/KBCTV/tv/playlist.m3u8','free'],
   ['ubc','UBC 울산','hls','https://stream.ubc.co.kr/hls/ubctvstream/index.m3u8','free'],
   ['tjb','TJB 대전','hls','https://vod.tjb.co.kr/live/_definst_/tv/playlist.m3u8','free'],
   ['cjb','CJB 청주','hls','https://wowza1.cjb.co.kr/live/cjbtv/playlist.m3u8','free'],
   ['jtv','JTV 전주','link','https://www.jtv.co.kr/page/00028.php','login'],
   ['tbc','TBC 대구','link','https://www.tbc.co.kr/','free'],['g1','G1 강원','link','https://www.g1tv.co.kr/','free'],
   ['jibs','JIBS 제주','link','https://www.jibstv.com/','free']]},
  {g:'지역 MBC',note:'방송사 자체 서버',items:[
   ['dgmbc','대구MBC','link','https://dgmbc.com/OnAir','free'],
   ['tjmbc','대전MBC','hls','https://ns1.tjmbc.co.kr/live/myStream.sdp/playlist.m3u8','free'],
   ['kjmbc','광주MBC','hls','https://media.kjmbc.co.kr/hls/live/stream/playlist.m3u8','free'],
   ['jmbc','전주MBC','link','https://www.jmbc.co.kr/onair/tv','free'],
   ['chmbc','춘천MBC','hls','https://stream.chmbc.co.kr/TV/myStream/playlist.m3u8','free'],
   ['mpmbc','목포MBC','hls','https://vod.mpmbc.co.kr/a_live/25246741/ch001/playlist.m3u8','free'],
   ['mbcgn','MBC경남','link','https://mbcgn.kr/06_oar/oar01.asp?mn_lnk=A','login'],
   ['mbceg','MBC강원영동','link','https://www.mbceg.co.kr/','free'],
   ['bsmbc','부산MBC','link','https://www.busanmbc.co.kr/','free'],['jjmbc','제주MBC','link','https://www.jejumbc.com/','free']]}]},
 {tab:'SOOP',live:true,groups:[]},
 {tab:'무료 플랫폼',groups:[
  {g:'FAST · 라이브 플랫폼',items:[
   ['stvp','삼성 TV 플러스','link','https://www.samsungtvplus.com/','free'],
   ['soop','SOOP LIVE','link','https://www.sooplive.co.kr/','free'],
   ['chzzk','치지직','link','https://chzzk.naver.com/','free'],
   ['ytlive','YouTube 라이브','link','https://www.youtube.com/live','free']]}]},
 {tab:'음악',groups:[
  {g:'차트',items:[
   ['melon','멜론 TOP100','link','https://www.melon.com/chart/index.htm','free'],
   ['ytchart','YouTube 인기곡 (한국)','link','https://charts.youtube.com/charts/TopSongs/kr/weekly','free'],
   ['ytmv','YouTube 인기 뮤비 (한국)','link','https://charts.youtube.com/charts/TopVideos/kr/weekly','free']]}]}
];

/* 2026-10-24 PC 실측: 방송사 공식 페이지·SOOP는 다른 사이트 안 삽입 차단 → 새 탭.
   YouTube는 channel 방식 임베드가 막혀 영상 ID로 재생, 영상 ID가 바뀌면 새 탭 버튼 */
const ALL=[];DATA.forEach(t=>t.groups.forEach(g=>g.items.forEach(a=>ALL.push({id:a[0],n:a[1],t:a[2]==='web'?'link':a[2],u:a[3],s:a[4],v:a[5],tab:t.tab,g:g.g}))));
const BY=Object.fromEntries(ALL.map(c=>[c.id,c]));
const SL={free:'무료',login:'로그인',paid:'구독'},TL={hls:'바로재생',yt:'YouTube',web:'공식 플레이어',link:'새 탭'};
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=new Set(ls.get('tvwa.f',[])),recent=ls.get('tvwa.r',[]),tab=ls.get('tvwa.t','공중파'),cur=null,hls=null,phTimer=null;
const TABS=['즐겨찾기','공중파','종편·케이블','뉴스','지역방송','SOOP','무료 플랫폼','음악'];
TL.embed='공식 임베드';
let soop=null,soopAt=0;
function loadSoop(force){
  if(soop&&!force&&Date.now()-soopAt<120000)return Promise.resolve(soop);
  return new Promise(res=>{
    const cb='__soop'+Date.now();const s=document.createElement('script');
    const done=d=>{delete window[cb];s.remove();if(d&&d.broad){soop=d.broad.filter(b=>b.broad_grade!=='19'&&b.is_password!=='Y'&&b.subscription_only!=='1').slice(0,60);soopAt=Date.now()}res(soop)};
    window[cb]=done;s.onerror=()=>done(null);setTimeout(()=>window[cb]&&done(null),8000);
    s.src=`https://live.sooplive.com/api/main_broad_list_api.php?callback=${cb}&selectType=action&selectValue=all&orderType=view_cnt&pageNo=1&lang=`;
    document.head.appendChild(s);
  });
}
function soopCard(b){
  const c={id:'soop-'+b.user_id,n:b.user_nick,t:'link',u:`https://play.sooplive.com/${encodeURIComponent(b.user_id)}`,s:'free',g:'SOOP',tab:'SOOP',title:b.broad_title};
  BY[c.id]=c;
  const v=(+b.current_view_cnt||0)+(+b.m_current_view_cnt||0);
  return `<button class="ch sp${cur&&cur.id===c.id?' on':''}" data-id="${esc(c.id)}"><img loading="lazy" alt="" src="https:${esc(b.broad_thumb)}"><span class="ch-n">${esc(b.user_nick)}</span><span class="sp-t">${esc(b.broad_title)}</span><span class="ch-m"><span class="bd t-yt">● ${v.toLocaleString()}명</span></span></button>`;
}
function renderSoop(){
  $('#list').innerHTML='<div class="empty">SOOP 인기 방송 불러오는 중…</div>';
  loadSoop().then(list=>{
    if(tab!=='SOOP'||$('#q').value.trim())return;
    $('#list').innerHTML=list&&list.length
      ?`<section class="group"><div class="g-head"><h3>SOOP 인기 라이브</h3><span>시청자 순 · ${list.length}개 · <button class="pb" id="soopRe" style="min-height:30px">새로고침</button></span></div><div class="grid">${list.map(soopCard).join('')}</div></section>`
      :'<div class="empty">SOOP 목록을 불러오지 못했습니다</div>';
    const r=$('#soopRe');if(r)r.onclick=()=>{loadSoop(true).then(renderSoop)};
  });
}
if(!TABS.includes(tab))tab='공중파';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab${t===tab?' on':''}" data-t="${t}">${t==='즐겨찾기'?'★ ':''}${t}</button>`).join('');
}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.t;ls.set('tvwa.t',tab);$('#q').value='';renderTabs();render();window.scrollTo({top:0,behavior:'smooth'})};
$('#favTop').onclick=()=>{tab='즐겨찾기';renderTabs();render()};

function card(c){
  return `<button class="ch${cur&&cur.id===c.id?' on':''}" data-id="${c.id}">${favs.has(c.id)?'<span class="star">★</span>':''}<span class="ch-n">${esc(c.n)}</span><span class="ch-m"><span class="bd s-${c.s}">${SL[c.s]}</span><span class="bd t-${c.t}">${TL[c.t]}</span></span></button>`;
}
function groupHTML(title,items,note){
  if(!items.length)return'';
  return `<section class="group"><div class="g-head"><h3>${esc(title)}</h3><span>${items.length}개${note?' · '+esc(note):''}</span></div><div class="grid">${items.map(card).join('')}</div></section>`;
}
function render(){
  const q=$('#q').value.trim().toLowerCase();let h='';
  if(q){
    const r=ALL.filter(c=>(c.n+' '+c.g+' '+c.tab).toLowerCase().includes(q));
    h=r.length?groupHTML(`'${$('#q').value.trim()}' 검색 결과`,r):'<div class="empty">검색 결과가 없습니다</div>';
  }else if(tab==='즐겨찾기'){
    const f=ALL.filter(c=>favs.has(c.id)),rc=recent.map(id=>BY[id]).filter(Boolean);
    h=groupHTML('즐겨찾기',f)+groupHTML('최근 시청',rc);
    if(!f.length)h=`<div class="empty">채널을 길게 누르거나 플레이어의 ☆ 버튼으로 즐겨찾기에 추가하세요</div>`+h;
  }else if(tab==='SOOP'){renderSoop();return}
  else{
    const t=DATA.find(d=>d.tab===tab);
    h=`<div class="legend"><span><i class="bd t-hls">바로재생</i> 이 화면에서 재생</span><span><i class="bd t-yt">YouTube</i> 공식 채널 라이브</span><span><i class="bd t-link">새 탭</i> 방송사 공식 페이지로 이동</span></div>`;
    if(tab==='공중파')h+=`<div class="custom"><input id="m3u" type="url" inputmode="url" placeholder="시청 권한이 있는 m3u8 주소를 붙여넣고 재생" aria-label="m3u8 주소"><button class="pb" id="m3uGo">재생</button></div>`;
    h+=t.groups.map(g=>groupHTML(g.g,g.items.map(a=>BY[a[0]]),g.note)).join('');
  }
  $('#list').innerHTML=h;
  const go=$('#m3uGo');if(go)go.onclick=()=>{const u=$('#m3u').value.trim();if(!/^https?:\/\/.+/i.test(u)){toast('http(s) 주소를 입력하세요');return}play({id:'custom',n:'직접 입력 스트림',t:'hls',u,s:'free',g:'사용자 입력',tab:''})};
}

/* long-press = favourite */
let lp=null,lpFired=false;
$('#list').addEventListener('pointerdown',e=>{const b=e.target.closest('.ch');if(!b)return;lpFired=false;lp=setTimeout(()=>{lpFired=true;toggleFav(b.dataset.id)},550)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('#list').addEventListener(ev,()=>clearTimeout(lp)));
$('#list').addEventListener('contextmenu',e=>{const b=e.target.closest('.ch');if(b){e.preventDefault();if(!lpFired)toggleFav(b.dataset.id);lpFired=true}});
$('#list').addEventListener('click',e=>{const b=e.target.closest('.ch');if(!b)return;if(lpFired){lpFired=false;return}play(BY[b.dataset.id])});

function toggleFav(id){
  if(!ALL.some(c=>c.id===id)){toast('SOOP 방송은 즐겨찾기를 지원하지 않습니다');return}
  if(favs.has(id)){favs.delete(id);toast('즐겨찾기에서 뺐습니다')}else{favs.add(id);toast('★ 즐겨찾기에 추가')}
  ls.set('tvwa.f',[...favs]);render();syncFavBtn();
}
function syncFavBtn(){const on=cur&&favs.has(cur.id);$('#pFav').classList.toggle('on',!!on);$('#pFav').textContent=on?'★ 즐겨찾기':'☆ 즐겨찾기';$('#pFav').hidden=!cur||cur.id==='custom'}

function showPH(text,spin,btn){
  const ph=$('#ph');ph.hidden=false;
  ph.innerHTML=(spin?'<div class="spin"></div>':'')+`<p>${esc(text)}</p>`+(btn?`<button class="go" id="phGo">${esc(btn)}</button>`:'');
  const g=$('#phGo');if(g)g.onclick=openCur;
}
function stop(){
  clearTimeout(phTimer);
  if(hls){hls.destroy();hls=null}
  const v=$('#vid');v.pause();v.removeAttribute('src');v.load();v.hidden=true;
  const f=$('#frm');f.src='about:blank';f.hidden=true;
}
function openCur(){if(!cur)return;const u=cur.t==='yt'?`https://www.youtube.com/channel/${cur.u}/live`:cur.u;window.open(u,'_blank','noopener')}

function play(c){
  if(c.t==='link'){cur=c;openCur();addRecent(c);render();return}
  stop();cur=c;addRecent(c);
  $('#pcol').hidden=false;$('#layout').classList.add('has-player');
  $('#pName').textContent=c.n;
  $('#pSub').textContent=`${c.g} · ${SL[c.s]} · ${TL[c.t]}`;
  syncFavBtn();
  const v=$('#vid'),f=$('#frm');
  if(c.t==='hls'){
    showPH('스트림 연결 중',true);v.hidden=false;
    const ok=()=>{$('#ph').hidden=true;v.play().catch(()=>showPH('재생 버튼을 눌러 시작하세요',false))};
    if(window.Hls&&Hls.isSupported()){
      hls=new Hls({enableWorker:true,lowLatencyMode:true,backBufferLength:30});
      hls.loadSource(c.u);hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,ok);
      let tries=0;
      hls.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&tries++<2){showPH('재연결 중…',true);hls.startLoad();return}
        if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&tries++<2){hls.recoverMediaError();return}
        showPH('스트림을 불러오지 못했습니다. 방송 시간이 아니거나 주소가 바뀌었을 수 있습니다.',false,'다시 시도');$('#phGo').onclick=()=>play(c)});
    }else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=c.u;v.addEventListener('loadedmetadata',ok,{once:true})}
    else showPH('이 브라우저는 HLS를 지원하지 않습니다',false);
  }else{
    f.hidden=false;
    f.src=c.t==='yt'?`https://www.youtube.com/embed/${c.v}?autoplay=1&playsinline=1`:c.u;
    showPH(c.t==='yt'?'YouTube 라이브 불러오는 중':c.t==='embed'?'SOOP 플레이어 불러오는 중':'공식 플레이어 불러오는 중',true);
    if(c.t==='yt')$('#pSub').textContent='"볼 수 없음"이 뜨면 라이브가 새로 시작된 것 → 새 탭 ↗';
    f.onload=()=>{if(f.src!=='about:blank')$('#ph').hidden=true};
    phTimer=setTimeout(()=>{$('#ph').hidden=true},3000);
  }
  render();
  if(innerWidth<1000)$('#pcol').scrollIntoView({behavior:'smooth',block:'start'});
}
function addRecent(c){if(c.id==='custom')return;recent=[c.id,...recent.filter(x=>x!==c.id)].slice(0,8);ls.set('tvwa.r',recent)}

$('#pOpen').onclick=openCur;
$('#pFav').onclick=()=>cur&&toggleFav(cur.id);
$('#pClose').onclick=()=>{stop();cur=null;$('#pcol').hidden=true;$('#layout').classList.remove('has-player');render()};
$('#pFull').onclick=()=>{const el=!$('#vid').hidden?$('#vid'):$('.p-frame');(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)?.catch?.(()=>toast('전체화면을 지원하지 않습니다'))};
$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)$('#pClose').click()});
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,20000);
renderTabs();render();
</script>
</body>
</html>
