<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명왕사신TV - IPTV Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- HLS.js for Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-tv text-indigo-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                명왕사신TV
            </h1>
        </div>
        <div class="flex items-center space-x-2 text-sm text-slate-400">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="channel-count">채널 불러오는 중...</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 p-4 max-w-[1920px] w-full mx-auto">
        
        <!-- Video Player Section (LGs: 3 Cols) -->
        <section class="lg:col-span-3 flex flex-col bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
            <div class="relative w-full aspect-video bg-black flex items-center justify-center group">
                <video id="video-player" class="w-full h-full object-contain" controls autoplay></video>
                <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400 z-10">
                    <i class="fa-solid fa-play-circle text-6xl text-indigo-500 mb-4 animate-bounce"></i>
                    <p class="text-lg">재생할 채널을 오른쪽 목록에서 선택해 주세요.</p>
                </div>
            </div>
            
            <!-- Player Info Bar -->
            <div class="p-4 bg-slate-900 flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-t border-slate-800">
                <div>
                    <h2 id="current-title" class="text-lg font-bold text-slate-100">채널을 선택하세요</h2>
                    <p id="current-url" class="text-xs text-slate-500 truncate max-w-md">Stream URL</p>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="btn-reload" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition">
                        <i class="fa-solid fa-rotate-right mr-1"></i> 새로고침
                    </button>
                </div>
            </div>
        </section>

        <!-- Channel List Section (LGs: 1 Col) -->
        <section class="lg:col-span-1 bg-slate-900 rounded-2xl border border-slate-800 flex flex-col h-[600px] lg:h-auto overflow-hidden">
            <!-- Search & Filter Bar -->
            <div class="p-4 border-b border-slate-800 flex flex-col gap-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="text" id="search-input" placeholder="채널 이름 검색..." 
                           class="w-full bg-slate-950 text-slate-200 text-sm rounded-xl pl-9 pr-4 py-2 border border-slate-800 focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- List Item Container -->
            <div id="channel-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Channels rendered by JS -->
            </div>
        </section>
    </main>

        // App States
        let channels = [];
        let currentChannel = null;
        let hlsPlayer = null;

        // Elements
        const videoElement = document.getElementById('video-player');
        const placeholderElement = document.getElementById('player-placeholder');
        const channelListElement = document.getElementById('channel-list');
        const searchInputElement = document.getElementById('search-input');
        const currentTitleElement = document.getElementById('current-title');
        const currentUrlElement = document.getElementById('current-url');
        const channelCountElement = document.getElementById('channel-count');
        const btnReload = document.getElementById('btn-reload');

        // Parse M3U Text
        function parseM3U(data) {
            const lines = data.split('\n');
            const parsed = [];
            let currentName = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) {
                        currentName = line.substring(commaIdx + 1).trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    parsed.push({
                        id: 'ch_' + parsed.length,
                        name: currentName || `채널 ${parsed.length + 1}`,
                        url: line
                    });
                    currentName = '';
                }
            }
            return parsed;
        }

        // Render Channels
        function renderChannels(filter = '') {
            channelListElement.innerHTML = '';
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(filter.toLowerCase()));

            filtered.forEach(ch => {
                const isSelected = currentChannel && currentChannel.id === ch.id;
                const item = document.createElement('button');
                item.className = `w-full text-left px-4 py-3 rounded-xl flex items-center justify-between transition group ${
                    isSelected ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-950/40 hover:bg-slate-800 text-slate-300'
                }`;

                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <i class="fa-solid ${isSelected ? 'fa-circle-play text-indigo-400' : 'fa-tv text-slate-600 group-hover:text-slate-400'} text-sm"></i>
                        <span class="font-medium text-sm truncate">${ch.name}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-600 opacity-0 group-hover:opacity-100 transition"></i>
                `;

                item.onclick = () => playChannel(ch);
                channelListElement.appendChild(item);
            });
        }

        // Play Channel Stream
        function playChannel(channel) {
            currentChannel = channel;
            placeholderElement.classList.add('hidden');
            currentTitleElement.textContent = channel.name;
            currentUrlElement.textContent = channel.url;

            if (Hls.isSupported()) {
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                }
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(channel.url);
                hlsPlayer.attachMedia(videoElement);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play().catch(() => {});
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = channel.url;
                videoElement.play().catch(() => {});
            }

            renderChannels(searchInputElement.value);
        }

        // Event Listeners
        searchInputElement.addEventListener('input', (e) => renderChannels(e.target.value));
        btnReload.addEventListener('click', () => {
            if (currentChannel) playChannel(currentChannel);
        });

            renderChannels();
